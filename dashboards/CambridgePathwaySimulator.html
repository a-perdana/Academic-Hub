      if (!window.ENV) window.ENV = {
        FIREBASE_API_KEY: "__FIREBASE_API_KEY__",
        FIREBASE_AUTH_DOMAIN: "__FIREBASE_AUTH_DOMAIN__",
        FIREBASE_PROJECT_ID: "__FIREBASE_PROJECT_ID__",
        FIREBASE_STORAGE_BUCKET: "__FIREBASE_STORAGE_BUCKET__",

    <!-- Public page: no auth-guard (no login required). -->
    <!-- Public page: Firebase initialised inline below for Firestore writes. -->
    <script type="module">
      import { initializeApp, getApps }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const cfg = {
        apiKey:            window.ENV.FIREBASE_API_KEY,
        authDomain:        window.ENV.FIREBASE_AUTH_DOMAIN,
        projectId:         window.ENV.FIREBASE_PROJECT_ID,
        storageBucket:     window.ENV.FIREBASE_STORAGE_BUCKET,
        messagingSenderId: window.ENV.FIREBASE_MESSAGING_SENDER_ID,
        appId:             window.ENV.FIREBASE_APP_ID,
      };
      const app = getApps().length ? getApps()[0] : initializeApp(cfg);
      const db  = getFirestore(app);

      window.db = db;
      window.fsOps = { collection, addDoc, serverTimestamp };
      document.dispatchEvent(new Event('firebaseReady'));
    </script>

          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>

      function CambridgePathwaySelector() {
        // Subject lists, counts and wording follow the live Curriculum Module
        // forms and guides (Academic Services 26-27):
        //   Lower Secondary Checkpoint Form, Cambridge IGCSE Subject Selection
        //   Form, Cambridge AS Level Subject Selection Form, Student Pathways &
        //   Subject Selection Guide 26-27, Subject Profiles & Comparison Guide
        //   26-27, Grades 11-12 Structure. Where the Pathways Guide and a form
        //   differ on a pathway list, the form wins: the guide names the form
        //   as "the operational source for ... pathway choices" (B.5).
        const [stage, setStage] = useState("checkpoint");
        const [studentName, setStudentName] = useState("");
        const [schoolName, setSchoolName] = useState("");
        const [classSection, setClassSection] = useState("");
        const [academicYear, setAcademicYear] = useState("");
        const [formsMenuOpen, setFormsMenuOpen] = useState(false);
        const [refsMenuOpen, setRefsMenuOpen] = useState(false);
        const [submitState, setSubmitState] = useState("idle"); // idle | submitting | success | error
        const [checkpointSubjects, setCheckpointSubjects] = useState({
          english: true,
          mathematics: true,
          science: true,
          computing: false,
          globalPerspectives: false,
        });
        const [igcseEnglishRoute, setIgcseEnglishRoute] = useState("");
        const [igcsePathway, setIgcsePathway] = useState("");
        const [igcseElectives, setIgcseElectives] = useState([]);
        const [asPathway, setAsPathway] = useState("");
        const [asCustomSubjects, setAsCustomSubjects] = useState(["", "", ""]);
        const [asAdditional, setAsAdditional] = useState("");
        const [aLevelInterest, setALevelInterest] = useState("");

        const stageInfo = {
          checkpoint: {
            title: "Lower Secondary (Grades 7–8)",
            description:
              "Cambridge Lower Secondary is taught through Eduversal's accelerated two-year Stage 7–9 sequence. Stage 8 is split across Grades 7 and 8, so Stage 9 is completed before the Cambridge Lower Secondary Checkpoint at the end of Grade 8. The network default is the May Checkpoint series.",
            recommendation:
              "All students take the three core subjects: English as a Second Language (0876), Mathematics (0862) and Science (0893). Computing (0860) and Global Perspectives (1129) are recommended enrichment subjects that help prepare for IGCSE pathways. Checkpoint tests English, Mathematics and Science only — enrichment subjects are school curriculum choices, not additional Checkpoint tests.",
          },
          igcse: {
            title: "IGCSE (Grades 9–10)",
            description:
              "Grade 9 is Year 1 of IGCSE preparation, not the end of SMP. Grade 10 completes the IGCSE cycle, and most Grade 10 candidates sit the May/June series. IGCSE subjects are chosen in Grade 8, Semester II, on the official Cambridge IGCSE Subject Selection Form.",
            recommendation:
              "The network default is six IGCSE subjects: three core subjects — Bahasa Indonesia (0538), Mathematics (0580) and the English route approved by the school — plus three pathway subjects. Students may combine subjects across pathways with Academic Coordinator approval. A programme below six subjects is an exception that needs documented review; it is not a separate standard pathway.",
          },
          aslevel: {
            title: "AS & A Level (Grades 11–12)",
            description:
              "AS Level is the Eduversal standard programme. Grade 11 focuses on AS Level content, and Grade 12 students sit their AS Level examinations in the October/November series. AS subjects are chosen in Grade 10, Semester II, on the official Cambridge AS Level Subject Selection Form.",
            recommendation:
              "Every student takes four AS Level subjects: three approved pathway subjects plus Cambridge International AS Level English General Paper (8021), which is included automatically. Full A Level is an additional continuation option after AS — it never replaces the four-AS standard.",
          },
        };

        // ── Lower Secondary (Lower Secondary Checkpoint Form + Pathways Guide A.2) ──
        const checkpointInfo = {
          core: {
            title: "Core Checkpoint Subjects (all students)",
            description:
              "All students take these three subjects. They are also the three subjects of the Cambridge Lower Secondary Checkpoint.",
            subjects: [
              { key: "english", name: "English as a Second Language", code: "0876",
                description: "Reading, writing, speaking, and understanding English." },
              { key: "mathematics", name: "Mathematics", code: "0862",
                description: "Numbers, shapes, and patterns — problem-solving and logical reasoning." },
              { key: "science", name: "Science", code: "0893",
                description: "Biology, chemistry, and physics through experiments and investigation. Students interested in the Medical & Life Sciences pathway should build a strong foundation here." },
            ],
          },
          enrichment: {
            title: "Enrichment Subjects (recommended)",
            description:
              "These enrichment subjects help prepare students for their future IGCSE pathways. They are school curriculum choices; they are not additional Checkpoint tests.",
            subjects: [
              { key: "computing", name: "Computing", code: "0860",
                description: "Computer systems, programming, and problem-solving with technology.",
                prepares: "Supports IGCSE Computer Science and ICT." },
              { key: "globalPerspectives", name: "Global Perspectives", code: "1129",
                description: "Global issues and cultures through research and critical thinking.",
                prepares: "Builds the academic writing, research, and critical thinking needed for IGCSE and A Level subjects." },
            ],
          },
        };

        // ── IGCSE (Cambridge IGCSE Subject Selection Form §1-3; groups from Pathways Guide B) ──
        const igcseCore = [
          { name: "Bahasa Indonesia", code: "0538", group: "Group I" },
          { name: "Mathematics", code: "0580", group: "Group IV" },
        ];
        const englishRoutes = [
          { code: "0500", name: "English – First Language" },
          { code: "0510", name: "English as a Second Language — Speaking Endorsement" },
          { code: "0511", name: "English as a Second Language — Count-in Speaking" },
        ];

        // Subject descriptions: "Good fit" lines of the Subject Profiles & Comparison Guide 26-27.
        const IG = {
          "0625": { name: "Physics", group: "Group III", description: "For students who enjoy explaining how systems work and applying mathematics to physical situations." },
          "0620": { name: "Chemistry", group: "Group III", description: "For students interested in matter, reactions, patterns, laboratory work, and explaining change at particle level." },
          "0610": { name: "Biology", group: "Group III", description: "For students interested in living systems, health, organisms, and evidence-based biological explanation." },
          "0606": { name: "Additional Mathematics", group: "Group IV", description: "For students who enjoy algebraic reasoning, multi-step problem solving, functions, and abstract mathematics. Needs a consistently strong Mathematics foundation." },
          "0478": { name: "Computer Science", group: "Group V", description: "For students interested in algorithms, computational thinking, programming, systems, and logical problem solving.", note: "For examinations from 2029, the school confirms paper-based 0478 or the digital-only route 0265." },
          "0417": { name: "ICT", group: "Group V", description: "For students interested in practical use of digital tools, information handling, productivity systems, and applied technology." },
          "0445": { name: "Design & Technology", group: "Group V", description: "For students who enjoy designing, making, solving practical problems, and improving products or systems." },
          "0264": { name: "Business", group: "Group V", description: "For students interested in organisations, entrepreneurship, marketing, operations, people, and business decision-making.", note: "Cambridge IGCSE Business uses syllabus code 0264 for examinations from 2027 onward (previously Business Studies 0450)." },
          "0455": { name: "Economics", group: "Group II", description: "For students interested in choices, markets, incentives, national economies, data, and cause-and-effect reasoning." },
          "0452": { name: "Accounting", group: "Group V", description: "For students who enjoy structured numerical work, financial records, accuracy, and systematic procedures." },
          "0653": { name: "Combined Science", group: "Group III", description: "For students who want broad science coverage across Biology, Chemistry, and Physics rather than separate full science subjects." },
          "0479": { name: "Statistics", group: "Group IV or V", description: "For students interested in data, probability, modelling, interpretation, and evidence-based conclusions.", note: "Verify current administrative-zone and series availability." },
          "0266": { name: "Psychology", group: "Group II (from 2027)", description: "For students interested in behaviour, cognition, research evidence, and scientific approaches to human questions.", note: "Verify availability for the intended Cambridge series and zone." },
          "0648": { name: "Food & Nutrition", group: "Group V", description: "For students interested in nutrition, food science, health, practical application, and informed food choices." },
          "0460": { name: "Geography", group: "Group II", description: "For students interested in people, places, environments, physical processes, development, and spatial patterns." },
          "0495": { name: "Sociology", description: "For students interested in society, institutions, identity, social change, and competing explanations of human behaviour." },
          "0457": { name: "Global Perspectives", group: "Group II", description: "For students who enjoy research, multiple perspectives, evidence, communication, and global issues." },
          "0680": { name: "Environmental Management", group: "Group III", description: "For students interested in environmental systems, sustainability, resources, and human–environment interactions." },
          "0470": { name: "History", description: "For students who enjoy evidence, causation, change over time, competing interpretations, and argumentative writing." },
          "0475": { name: "Literature in English", description: "For students who enjoy close reading, interpretation, discussion, and analytical writing about texts." },
          "0400": { name: "Art & Design", description: "For students who enjoy sustained visual exploration, experimentation, development of ideas, and creative decision-making." },
        };
        const igName = (code) => (IG[code] ? `${IG[code].name} (${code})` : code);

        const igcsePathways = {
          engineering: {
            name: "Engineering & Technology",
            icon: BookOpen,
            description: "For students who enjoy solving problems and are strong in mathematics and science. This path builds toward university study in mechanical, electrical, civil, computer, or aerospace engineering.",
            profile: "Recommended profile: Physics + Chemistry + Additional Mathematics or another approved technology subject.",
            profileCodes: ["0625", "0620"],
            subjects: ["0625", "0620", "0606", "0478", "0417", "0445"],
          },
          business: {
            name: "Business & Digital Economy",
            icon: Briefcase,
            description: "For students interested in entrepreneurship, finance, marketing, or management. This path builds toward business degrees and careers in companies, startups, and international trade.",
            profile: "Network-default profile: Economics + Business + one additional approved pathway subject such as Accounting, ICT, Computer Science, Combined Science, or Statistics where available.",
            profileCodes: ["0264", "0455"],
            subjects: ["0264", "0455", "0452", "0417", "0478", "0653", "0479"],
          },
          medical: {
            name: "Medical & Life Sciences",
            icon: Heart,
            description: "For students who care about health, biology, and helping others. This path builds toward medicine, dentistry, pharmacy, or biomedical sciences.",
            profile: "Recommended profile: Biology + Chemistry + Physics where the student's future study plan and school timetable support this combination.",
            profileCodes: ["0610", "0620", "0625"],
            subjects: ["0610", "0620", "0625", "0266", "0417", "0648"],
          },
          humanities: {
            name: "Humanities & Social Sciences",
            icon: Globe,
            description: "A route for students whose direction lies outside the Engineering, Business and Medical paths.",
            profile: "",
            profileCodes: [],
            subjects: ["0460", "0495", "0457", "0680", "0470", "0475"],
          },
          creative: {
            name: "Creative & Design",
            icon: Target,
            description: "A route for students whose direction lies outside the Engineering, Business and Medical paths.",
            profile: "",
            profileCodes: [],
            subjects: ["0400", "0445", "0417", "0475", "0457"],
          },
        };

        // ── AS Level (AS Level Subject Selection Form §1-5; Pathways Guide C; Subject Profiles §3) ──
        const AS = {
          "9709": { name: "Mathematics", description: "Sustained algebraic fluency, functions, modelling, multi-step reasoning, accuracy, and regular independent practice. Central to all three network combinations." },
          "9702": { name: "Physics", description: "Needs strong mathematical reasoning and secure physics foundations; conceptual depth, quantitative application and practical reasoning." },
          "9701": { name: "Chemistry", description: "Needs strong Chemistry foundations and quantitative reasoning; significant conceptual depth, calculations and practical understanding." },
          "9700": { name: "Biology", description: "Needs secure Biology foundations and strong academic reading; a large interconnected content base plus application and analysis." },
          "9708": { name: "Economics", description: "Needs analytical writing and numerical / graphical reasoning; moves beyond description to analysis and balanced evaluation." },
          "9609": { name: "Business", description: "Needs structured writing, quantitative business analysis and decision-making applied to case material." },
        };
        const asName = (code) => (AS[code] ? `${AS[code].name} (${code})` : code);

        const asTracks = {
          engineering: {
            name: "Engineering",
            icon: BookOpen,
            subjects: ["9709", "9702", "9701"],
            extras: [
              { label: "Further Mathematics (9231)", why: "Strongly recommended for competitive engineering programs." },
              { label: "Computer Science (9618)", why: "Useful for software, AI, or computer engineering." },
            ],
          },
          business: {
            name: "Business",
            icon: Briefcase,
            subjects: ["9709", "9708", "9609"],
            extras: [
              { label: "Accounting (9706)", why: "Useful for finance and accounting degrees." },
              { label: "Psychology (9990)", why: "Helpful for marketing or human resources, through the study of consumer behaviour." },
            ],
            note: "Mathematics, Economics, and Business form the network's standard Business track. Some university programmes may prefer or require a different subject profile, so target-university requirements should be checked individually before any additional subject is added.",
          },
          medical: {
            name: "Medical",
            icon: Heart,
            subjects: ["9709", "9700", "9701"],
            extras: [
              { label: "Physics (9702)", why: "Useful for medical physics (for example, imaging) or Biomedical Engineering." },
            ],
          },
          individual: {
            name: "Individual / Other pathway",
            icon: Globe,
            subjects: [],
            extras: [],
          },
        };

        const aLevelOptions = [
          { key: "interested", label: "Interested in provisional A Level continuation planning" },
          { key: "not_planning", label: "Not currently planning A Level continuation" },
          { key: "undecided", label: "Not yet decided" },
        ];

        const handleIgcseElectiveToggle = (subjectCode) => {
          if (igcseElectives.includes(subjectCode)) {
            setIgcseElectives(igcseElectives.filter((s) => s !== subjectCode));
          } else if (igcseElectives.length < 3) {
            setIgcseElectives([...igcseElectives, subjectCode]);
          }
        };

        const enrichmentCount = ["computing", "globalPerspectives"].filter((k) => checkpointSubjects[k]).length;
        const totalCheckpoint = 3 + enrichmentCount;
        const totalIgcse = 3 + igcseElectives.length;
        const crossPathway = !!igcsePathway &&
          igcseElectives.some((c) => !igcsePathways[igcsePathway].subjects.includes(c));

        const asRequired = asPathway === "individual"
          ? asCustomSubjects.map((s) => s.trim()).filter(Boolean)
          : asPathway ? asTracks[asPathway].subjects.map(asName) : [];
        const asReady = !!asPathway && asRequired.length === 3;
        const asTotal = 4 + (asAdditional.trim() ? 1 : 0);

        const handleSubmit = async () => {
          if (!studentName.trim()) {
            alert("Please enter the student name before submitting.");
            return;
          }

          // Build payload based on current stage. Field names kept from the
          // earlier version (checkpointSubjects / igcsePathway / asPathway /
          // pathwaySubjects / totalSubjects) so older submissions still read
          // the same way.
          const baseInfo = {
            studentName: studentName.trim(),
            schoolName:  schoolName.trim(),
            classSection: classSection.trim(),
            academicYear: academicYear.trim(),
            stage,
            submittedAt: window.fsOps.serverTimestamp(),
          };

          let selections;
          if (stage === "checkpoint") {
            const selected = Object.entries(checkpointSubjects)
              .filter(([, v]) => v)
              .map(([k]) => k);
            selections = { checkpointSubjects: selected, totalSubjects: totalCheckpoint };
          } else if (stage === "igcse") {
            const route = englishRoutes.find((r) => r.code === igcseEnglishRoute);
            selections = {
              igcsePathway,
              englishRoute: route ? `${route.name} (${route.code})` : "",
              coreSubjects: ["Bahasa Indonesia (0538)", "Mathematics (0580)", route ? `${route.name} (${route.code})` : "English route (to confirm)"],
              pathwaySubjects: igcseElectives.map(igName),
              crossPathway,
              totalSubjects: totalIgcse,
            };
          } else {
            selections = {
              asPathway,
              pathwaySubjects: asRequired,
              englishGeneralPaper: "English General Paper (8021)",
              additionalSubject: asAdditional.trim(),
              aLevelContinuation: aLevelInterest,
              totalSubjects: asTotal,
            };
          }

          setSubmitState("submitting");
          try {
            const { collection, addDoc } = window.fsOps;
            await addDoc(collection(window.db, "pathwaySubmissions"), { ...baseInfo, ...selections });
            setSubmitState("success");
          } catch (e) {
            console.error("Submit failed:", e);
            setSubmitState("error");
          }
        };

        const SubmitBlock = ({ label, doneText, disabled, color }) => (
          <div className="mt-6">
            {submitState === "success" ? (
              <div className="flex items-center gap-3 p-4 bg-green-50 border-2 border-green-300 rounded-xl">
                <CheckCircle2 className="text-green-600 flex-shrink-0" size={24} />
                <div>
                  <p className="font-semibold text-green-800">Submission saved successfully!</p>
                  <p className="text-sm text-green-700">{doneText}</p>
                </div>
              </div>
            ) : (
              <button
                onClick={handleSubmit}
                disabled={submitState === "submitting" || disabled}
                className={`w-full py-3 px-6 ${color} text-white font-bold rounded-xl transition-all shadow-md text-lg`}
              >
                {submitState === "submitting" ? "Saving..." : label}

                                      )}
                                      {isSelected && (
                                        <span className="text-xs px-2 py-1 bg-green-100 text-green-700 rounded font-semibold">SELECTED</span>
                                      )}
                                    </div>
                                    <p className="text-gray-700 text-sm">{subject.description}</p>
                                    {subject.note && (
                                      <p className="text-xs text-amber-700 mt-1">{subject.note}</p>
                                    )}
                                  </div>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      )}

                      <div className="bg-gradient-to-r from-green-50 to-emerald-50 p-6 rounded-xl border-2 border-green-200">
                        <div className="flex items-start gap-3">
                          <AlertCircle className="text-green-600 mt-1 flex-shrink-0" size={28} />
                          <div className="w-full">
                            <div className="flex items-center justify-between mb-3">
                              <h4 className="font-bold text-xl text-gray-800">Your IGCSE Subject Summary</h4>
                              <button
                                onClick={() => { setIgcsePathway(""); setIgcseElectives([]); setIgcseEnglishRoute(""); }}
                                className="text-xs px-3 py-1 bg-white border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition-all"
                              >
                                Reset
                              </button>
                            </div>
                            <div className="bg-white p-4 rounded-lg mb-3">
                              <div className="flex items-center justify-between mb-2">
                                <span className="text-gray-700 font-semibold">Total Subjects:</span>
                                <span className="text-3xl font-bold text-green-600">{totalIgcse}/6</span>
                              </div>
                              <div className="flex-1 bg-gray-200 rounded-full h-3">
                                <div
                                  className={`h-3 rounded-full transition-all ${totalIgcse === 6 ? "bg-green-600" : "bg-blue-600"}`}
                                  style={{ width: `${(totalIgcse / 6) * 100}%` }}
                                />
                              </div>
                              <p className="text-sm text-gray-600 mt-2">
                                {totalIgcse < 6
                                  ? `Select ${6 - totalIgcse} more pathway subject${6 - totalIgcse > 1 ? "s" : ""} to reach the six-subject network default.`
                                  : "✓ This matches the six-subject network default."}
                              </p>
                            </div>
                            <div className="bg-white p-4 rounded-lg text-sm text-gray-700 space-y-2">
                              <p><strong>Your Selections:</strong></p>
                              <p>
                                • Core: Bahasa Indonesia (0538), Mathematics (0580),{" "}
                                {igcseEnglishRoute
                                  ? `${englishRoutes.find((r) => r.code === igcseEnglishRoute).name} (${igcseEnglishRoute})`
                                  : "English route (choose above)"}
                              </p>
                              {igcseElectives.length > 0 && (
                                <p>• Pathway: {igcseElectives.map(igName).join(", ")}</p>
                              )}
                            </div>
                            {crossPathway && (
                              <div className="bg-amber-50 p-3 rounded-lg text-xs text-gray-700 mt-3">
                                <strong>Across pathways:</strong> your choices combine subjects from more than one pathway list. This is allowed with Academic Coordinator approval.
                              </div>
                            )}
                            <div className="bg-amber-50 p-3 rounded-lg text-xs text-gray-700 mt-3">
                              <strong>Before final approval</strong> the Academic Coordinator checks the student's academic profile, prerequisites and language readiness, the school's timetable and staffing, and the Cambridge syllabus, code and series availability for the year the student will sit the exam. University requirements vary by institution and country — check the official university information.
                            </div>
                          </div>
                        </div>
                      </div>

                      <SubmitBlock
                        label="Submit IGCSE Pathway Selections"
                        doneText="Your IGCSE pathway selections have been recorded."
                        disabled={!igcseEnglishRoute || igcseElectives.length === 0}
                        color="bg-green-600 hover:bg-green-700 disabled:bg-green-300"
                      />
                    </div>
                  )}

                  {/* AS & A Level Stage */}
                  {stage === "aslevel" && (
                    <div>
                      <div className="mb-8 bg-gradient-to-r from-indigo-50 to-purple-50 border-2 border-indigo-200 rounded-xl p-6">
                        <div className="flex items-start gap-3">
                          <GraduationCap className="text-indigo-600 flex-shrink-0 mt-1" size={32} />
                          <div>
                            <h4 className="font-bold text-xl text-gray-800 mb-3">Understanding AS & A Level</h4>
                            <div className="space-y-3 text-sm text-gray-700">
                              <div className="bg-red-50 border border-red-200 rounded-lg p-3">
                                <p>
                                  <strong className="text-red-700">AS Level — the Eduversal standard:</strong> four AS Level examinations — three approved pathway subjects plus English General Paper (8021). Grade 12 students sit them in the October/November series. This four-exam structure is an Eduversal programme requirement, not a universal Cambridge requirement.
                                </p>
                              </div>
                              <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-3">
                                <p>
                                  <strong className="text-indigo-700">Full A Level — an additional continuation option:</strong> planning begins in Grade 10 Semester II, provisional interest is recorded by the start of Grade 11, and continuation is confirmed during Grade 11. Approved students study A2 content after the AS examination period and sit A Level in the Grade 12 May/June series, in addition to the four AS examinations. Three A Levels are recommended for a stronger academic profile.
                                </p>
                              </div>
                              <p>
                                <strong>University requirements</strong> vary by institution, country, degree programme and admissions cycle. Check the official information for any target university. SAT, IELTS, TOEFL, AP and foundation programmes are separate considerations, not universal requirements.
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="mb-6">
                        <h3 className="font-bold text-2xl mb-4 text-gray-800">Shared Fourth Subject (all students)</h3>
                        <div className="bg-white border-2 border-red-300 rounded-xl p-5 shadow-sm">
                          <div className="flex items-start gap-3">
                            <CheckCircle2 className="text-red-600 flex-shrink-0 mt-1" size={28} />
                            <div className="flex-1">
                              <div className="flex flex-wrap items-center gap-2 mb-2">
                                <span className="font-bold text-xl text-gray-800">English General Paper</span>
                                <span className="text-sm px-3 py-1 bg-red-100 text-red-700 rounded font-semibold">8021</span>
                                <span className="text-xs px-3 py-1 bg-red-600 text-white rounded font-bold">INCLUDED AUTOMATICALLY</span>
                              </div>
                              <p className="text-gray-700">
                                AS-only — there is no A Level version. It builds critical reading, argument, evidence use and clear essay structure, and supports SAT and IELTS preparation. For examinations from 2028 it follows the revised 2028–2030 syllabus.
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="mb-6">
                        <h3 className="font-bold text-2xl mb-4 text-gray-800">Choose Your AS Subject Combination</h3>
                        <p className="text-gray-600 mb-6">
                          Select the combination that best matches your current direction. Final offerings depend on school capacity, timetable, staffing, viable enrolment and current Cambridge requirements.
                        </p>
                        <div className="grid md:grid-cols-2 gap-5">
                          {Object.entries(asTracks).map(([key, track]) => {
                            const IconComponent = track.icon;
                            const isSelected = asPathway === key;
                            return (
                              <button
                                key={key}
                                onClick={() => { setAsPathway(key); setSubmitState("idle"); }}
                                className={`p-6 rounded-xl border-2 transition-all text-left ${
                                  isSelected
                                    ? "border-indigo-600 bg-indigo-50 shadow-lg"
                                    : "border-gray-200 hover:border-gray-300 bg-white hover:shadow-md"
                                }`}
                              >
                                <IconComponent className={isSelected ? "text-indigo-600 mb-3" : "text-gray-400 mb-3"} size={32} />
                                <h4 className="font-bold text-lg text-gray-800 mb-2">{track.name}</h4>
                                <p className="text-sm text-gray-600">
                                  {key === "individual"
                                    ? "For students aiming for Law, International Relations, Psychology, Languages, the Arts or another direction: three approved AS subjects chosen through individual counselling, plus English General Paper (8021)."
                                    : `${track.subjects.map(asName).join(" · ")} + English General Paper (8021)`}
                                </p>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {asPathway && asPathway !== "individual" && (
                        <div className="mb-6">
                          <h3 className="font-bold text-2xl mb-4 text-gray-800">Required AS Subjects — {asTracks[asPathway].name}</h3>
                          <div className="space-y-3">
                            {asTracks[asPathway].subjects.map((code) => (
                              <div key={code} className="flex items-start gap-3 p-5 bg-white border-2 border-indigo-200 rounded-xl shadow-sm">
                                <CheckCircle2 className="text-indigo-600 flex-shrink-0 mt-1" size={24} />
                                <div className="flex-1">
                                  <div className="flex flex-wrap items-center gap-2 mb-1">
                                    <span className="font-bold text-lg text-gray-800">{AS[code].name}</span>
                                    <span className="text-sm px-2 py-1 bg-gray-100 text-gray-700 rounded">{code}</span>
                                    <span className="text-xs px-2 py-1 bg-indigo-100 text-indigo-700 rounded font-semibold">REQUIRED</span>
                                  </div>
                                  <p className="text-gray-700 text-sm">{AS[code].description}</p>
                                </div>
                              </div>
                            ))}
                          </div>
                          {asTracks[asPathway].note && (
                            <p className="text-sm text-gray-600 mt-3">{asTracks[asPathway].note}</p>
                          )}
                        </div>
                      )}

                      {asPathway === "individual" && (
                        <div className="mb-6">
                          <h3 className="font-bold text-2xl mb-2 text-gray-800">Your Three Approved AS Subjects</h3>
                          <p className="text-gray-600 mb-4">
                            Chosen through individual counselling, based on prerequisites, school offering, timetable viability and verified university requirements. Academic Coordinator approval is required after checking coherence, school feasibility, and university progression.
                          </p>
                          <div className="space-y-3">
                            {asCustomSubjects.map((val, i) => (
                              <input
                                key={i}
                                type="text"
                                placeholder={`Subject ${i + 1} and syllabus code`}
                                value={val}
                                onChange={(e) => {
                                  const next = [...asCustomSubjects];
                                  next[i] = e.target.value;
                                  setAsCustomSubjects(next);
                                  setSubmitState("idle");
                                }}
                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                              />
                            ))}
                          </div>
                        </div>
                      )}

                      {asPathway && (
                        <div className="mb-6 bg-amber-50 border-2 border-amber-200 rounded-xl p-5">
                          <h4 className="font-bold text-lg text-gray-800 mb-2 flex items-center gap-2">
                            <Info size={20} className="text-amber-600" />
                            Optional Additional AS Subject
                          </h4>
                          <p className="text-sm text-gray-700 mb-3">
                            A student may request an additional AS subject beyond the required four where academic readiness, timetable, staffing and workload allow. It is enrichment and needs Academic Coordinator approval; it never replaces one of the four required AS subjects.
                          </p>
                          {asTracks[asPathway].extras.length > 0 && (
                            <div className="flex flex-wrap gap-2 mb-3">
                              {asTracks[asPathway].extras.map((x) => (
                                <button
                                  key={x.label}
                                  onClick={() => setAsAdditional(asAdditional === x.label ? "" : x.label)}
                                  title={x.why}
                                  className={`text-xs px-3 py-2 rounded-lg border ${asAdditional === x.label ? "border-amber-500 bg-white font-semibold" : "border-amber-200 bg-white hover:border-amber-400"}`}
                                >
                                  {x.label} — {x.why}
                                </button>
                              ))}
                            </div>
                          )}
                          <input
                            type="text"
                            placeholder="Optional subject and syllabus code (leave empty if none)"
                            value={asAdditional}
                            onChange={(e) => setAsAdditional(e.target.value)}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent bg-white"
                          />
                        </div>
                      )}

                      {asPathway && (
                        <div className="mb-6 bg-white border-2 border-indigo-200 rounded-xl p-5">
                          <h4 className="font-bold text-lg text-gray-800 mb-2">Possible A Level Continuation</h4>
                          <div className="space-y-2">
                            {aLevelOptions.map((o) => (
                              <label key={o.key} className="flex items-center gap-3 text-gray-800 cursor-pointer">
                                <input
                                  type="radio"
                                  name="aLevelInterest"
                                  checked={aLevelInterest === o.key}
                                  onChange={() => { setALevelInterest(o.key); setSubmitState("idle"); }}
                                />
                                <span>{o.label}</span>
                              </label>
                            ))}
                          </div>
                          <p className="text-xs text-gray-500 mt-3">
                            This indication is for planning only. It does not commit the student or school. Final continuation is confirmed during Grade 11 after academic readiness, school offering, timetable, examination series and verified university requirements are reviewed.
                          </p>
                        </div>
                      )}

                      <div className="bg-gradient-to-r from-indigo-50 to-purple-50 p-6 rounded-xl border-2 border-indigo-200">
                        <div className="flex items-start gap-3">
                          <AlertCircle className="text-indigo-600 mt-1 flex-shrink-0" size={28} />
                          <div className="w-full">
                            <div className="flex items-center justify-between mb-3">
                              <h4 className="font-bold text-xl text-gray-800">Your AS Level Plan</h4>
                              <button
                                onClick={() => { setAsPathway(""); setAsCustomSubjects(["", "", ""]); setAsAdditional(""); setALevelInterest(""); }}
                                className="text-xs px-3 py-1 bg-white border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition-all"
                              >
                                Reset
                              </button>
                            </div>
                            <div className="bg-gradient-to-r from-red-100 to-indigo-100 p-3 rounded mb-3">
                              <p className="text-center font-bold text-gray-800">
                                Total AS Level subjects: {asTotal} (4 required{asAdditional.trim() ? " + 1 optional" : ""})
                              </p>
                            </div>
                            <div className="bg-white p-4 rounded-lg text-sm space-y-1">
                              <p className="font-semibold text-gray-800 mb-2">Your Subject List:</p>
                              {asRequired.map((s) => (
                                <p key={s} className="text-indigo-700">• <strong>{s}</strong> — Pathway</p>
                              ))}
                              {asRequired.length < 3 && (
                                <p className="text-gray-500">• {3 - asRequired.length} pathway subject{3 - asRequired.length > 1 ? "s" : ""} still to choose</p>
                              )}
                              <p className="text-red-700">• <strong>English General Paper (8021)</strong> — All students</p>
                              {asAdditional.trim() && (
                                <p className="text-amber-700">• {asAdditional.trim()} — Optional, needs approval</p>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>

                      <SubmitBlock
                        label="Submit AS Level Selections"
                        doneText="Your AS Level selections have been recorded."
                        disabled={!asReady}
                        color="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300"
                      />
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(
        <CambridgePathwaySelector />,
        document.getElementById("root"),
      );
    </script>
</body>
</html>
