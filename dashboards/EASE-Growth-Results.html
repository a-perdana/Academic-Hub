<script type="text/plain" id="ease-app-src">
/* ============================================================================
   EASE Growth dashboard — core: utilities, data model, statistics.
   Every figure on screen is computed here from the student responses in DATA.
   ========================================================================== */
'use strict';

// ---------- utilities --------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const attr = s => esc(s);
const isNum = x => typeof x === 'number' && isFinite(x);
const P = (x, d = 1) => isNum(x) ? (x * 100).toFixed(d) + '%' : '–';
const PN = (x, d = 1) => isNum(x) ? (x * 100).toFixed(d) : '–';
const PTS = (x, d = 1) => isNum(x) ? ((x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(d)) : '–';
const F = (x, d = 2) => isNum(x) ? x.toFixed(d) : '–';
const INT = x => isNum(x) ? Math.round(x).toLocaleString('en-US') : '–';
const sum = a => { let s = 0; for (const v of a) s += v; return s; };
const mean = a => a.length ? sum(a) / a.length : NaN;
function sdS(a) { if (a.length < 2) return NaN; const m = mean(a); let s = 0; for (const v of a) s += (v - m) ** 2; return Math.sqrt(s / (a.length - 1)); }
function varP(a) { const m = mean(a); let s = 0; for (const v of a) s += (v - m) ** 2; return s / a.length; }
function quant(sorted, p) { // type-7 linear interpolation
  if (!sorted.length) return NaN;
  const h = (sorted.length - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (h - lo);
}
function pearson(x, y) {
  const n = x.length, mx = mean(x), my = mean(y); let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const a = x[i] - mx, b = y[i] - my; sxy += a * b; sxx += a * a; syy += b * b; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : NaN;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('easeG:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('easeG:' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

// ---------- data model -------------------------------------------------------
const BP = DATA.blueprint;
const DOMS = BP.domains;
const DOM = Object.fromEntries(DOMS.map(d => [d.id, d]));
const SHORT = { ER1: 'Access & Retrieve', ER2: 'Integrate & Infer', ER3: 'Reflect & Evaluate', MR1: 'Apply / Formulate', MR2: 'Interpret / Represent', MR3: 'Reason / Evaluate', SL1: 'Observe / Interpret Evidence', SL2: 'Ask / Predict / Investigate', SL3: 'Conclude / Evaluate / Decide' };
const SKILLS = DOMS.flatMap(d => d.skills.map(s => ({ ...s, short: SHORT[s.id] || s.name, domain: d.id, dname: d.name, dshort: d.short })));
const SK = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const ITEMS = DATA.items;
const NQ = BP.nItems;
const KEYS = ITEMS.map(i => i.key);
const DCOL = { ER: 'var(--er)', MR: 'var(--mr)', SL: 'var(--sl)' };
const DSOFT = { ER: 'var(--er-soft)', MR: 'var(--mr-soft)', SL: 'var(--sl-soft)' };
const COGS = ['Knowing', 'Understanding', 'Applying', 'Analyzing', 'Evaluating'];
const STU = new Map();
function registerStudents(list) { for (const s of list) if (!STU.has(s.sid)) STU.set(s.sid, s); }
registerStudents(DATA.students);

const ADMINS = [];
function prepAdmin(adm) {
  const rows = adm.results.map(r => {
    const s = STU.get(r.sid) || { sid: r.sid, name: '(unknown)', school: '(unknown)', grade: 0, class: '' };
    const corr = new Uint8Array(NQ); let score = 0, blanks = 0;
    for (let q = 0; q < NQ; q++) {
      const a = r.resp[q];
      if (a === '.' || a === undefined) blanks++;
      else if (a === KEYS[q]) { corr[q] = 1; score++; }
    }
    const dom = {}, sk = {};
    for (const s2 of SKILLS) { let c = 0; for (const q of s2.items) c += corr[q - 1]; sk[s2.id] = c; }
    for (const d of DOMS) dom[d.id] = sum(d.skills.map(x => sk[x.id]));
    return { sid: r.sid, st: s, name: s.name, school: s.school, grade: s.grade, cls: s.class, status: r.status, resp: r.resp,
      minutes: r.minutes ?? null, corr, score, pct: score / NQ, dom, sk, blanks, answered: NQ - blanks };
  });
  adm.rows = rows;
  adm.fin = rows.filter(r => r.status === 'Finished');
  adm.bySid = new Map(rows.map(r => [r.sid, r]));
  adm._cache = new Map();
  return adm;
}
for (const a of DATA.administrations) ADMINS.push(prepAdmin(a));

const SCHOOLS = [...new Set(DATA.students.map(s => s.school))].sort((a, b) => a.localeCompare(b));
function classesOf(school, grade) {
  const set = new Map();
  for (const s of DATA.students) if (s.school === school && (!grade || s.grade === +grade)) set.set(s.class, (set.get(s.class) || 0) + 1);
  return [...set.keys()].sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true }));
}

// ---------- aggregation ------------------------------------------------------
function agg(rows) {
  const n = rows.length;
  const o = { n };
  if (!n) return o;
  const pcts = rows.map(r => r.pct), sorted = [...pcts].sort((a, b) => a - b);
  o.mean = mean(pcts); o.median = quant(sorted, .5); o.sd = sdS(pcts);
  o.q10 = quant(sorted, .1); o.q25 = quant(sorted, .25); o.q75 = quant(sorted, .75); o.q90 = quant(sorted, .9);
  o.min = sorted[0]; o.max = sorted[n - 1];
  o.se = o.sd / Math.sqrt(n); o.ci95 = 1.96 * o.se;
  o.dom = {}; for (const d of DOMS) o.dom[d.id] = mean(rows.map(r => r.dom[d.id] / 18));
  o.sk = {}; for (const s of SKILLS) o.sk[s.id] = mean(rows.map(r => r.sk[s.id] / s.items.length));
  o.p = new Float64Array(NQ); for (const r of rows) for (let q = 0; q < NQ; q++) o.p[q] += r.corr[q]; for (let q = 0; q < NQ; q++) o.p[q] /= n;
  o.blank = sum(rows.map(r => r.blanks)) / (n * NQ);
  o.blank5 = rows.filter(r => r.blanks >= 5).length;
  const g7 = rows.filter(r => r.grade === 7), g8 = rows.filter(r => r.grade === 8);
  o.g7n = g7.length; o.g8n = g8.length;
  o.g7 = g7.length ? mean(g7.map(r => r.pct)) : NaN; o.g8 = g8.length ? mean(g8.map(r => r.pct)) : NaN;
  o.bands10 = new Array(10).fill(0); for (const v of pcts) o.bands10[Math.min(9, Math.floor(v * 10 + 1e-9))]++;
  o.bands4 = [0, 0, 0, 0]; for (const v of pcts) o.bands4[v < .4 ? 0 : v < .6 ? 1 : v < .8 ? 2 : 3]++;
  const mins = rows.map(r => r.minutes).filter(isNum);
  o.minN = mins.length; o.minMean = mins.length ? mean(mins) : NaN;
  const raw = rows.map(r => r.score);
  let pq = 0; for (let q = 0; q < NQ; q++) pq += o.p[q] * (1 - o.p[q]);
  const vr = varP(raw);
  o.kr20 = n > 2 && vr > 0 ? NQ / (NQ - 1) * (1 - pq / vr) : NaN;
  o.sdRaw = sdS(raw); o.sem = o.sdRaw * Math.sqrt(1 - o.kr20);
  return o;
}
function A(adm, key, fn) { if (!adm._cache.has(key)) adm._cache.set(key, fn()); return adm._cache.get(key); }
const net = adm => A(adm, 'net', () => agg(adm.fin));
const schoolAgg = (adm, school) => A(adm, 's:' + school, () => agg(adm.fin.filter(r => r.school === school)));
function subsetRows(adm, f) {
  return adm.fin.filter(r => (!f.school || r.school === f.school) && (!f.grade || r.grade === +f.grade) && (!f.cls || String(r.cls) === String(f.cls)));
}
const subsetAgg = (adm, f) => A(adm, 'f:' + f.school + '|' + f.grade + '|' + f.cls, () => agg(subsetRows(adm, f)));

// Zerone grade-mix model (reproduced): expected = network G7/G8 means weighted by the school's own grade mix.
function benchmark(adm) {
  return A(adm, 'bench', () => {
    const N = net(adm);
    const out = SCHOOLS.map(s => {
      const a = schoolAgg(adm, s);
      const exp = (a.g7n * N.g7 + a.g8n * N.g8) / a.n;
      const diff = a.mean - exp;
      return { school: s, a, exp, diff, d: diff / N.sd, pos: diff > a.ci95 ? 'above' : diff < -a.ci95 ? 'below' : 'in line' };
    }).sort((x, y) => x.school.localeCompare(y.school));
    // No rank numbers (2026-10-01): the live EASE Growth Interpretation
    // Guides list "Ranking schools or teachers" among what the results are
    // not used for. Schools are listed by name; views re-sort by display name.
    // between-school share of variance (eta squared), raw and after removing the grade effect
    const eta = (vals, grp) => {
      const m = mean(vals); let sst = 0, ssb = 0; const g = new Map();
      vals.forEach((v, i) => { sst += (v - m) ** 2; const k = grp[i]; if (!g.has(k)) g.set(k, []); g.get(k).push(v); });
      for (const arr of g.values()) ssb += arr.length * (mean(arr) - m) ** 2;
      return ssb / sst;
    };
    const rows = adm.fin, sch = rows.map(r => r.school);
    const etaRaw = eta(rows.map(r => r.pct), sch);
    const etaAdj = eta(rows.map(r => r.pct - (r.grade === 7 ? N.g7 : N.g8)), sch);
    return { list: out, etaRaw, etaAdj };
  });
}

// ---------- item analysis ----------------------------------------------------
const OPTS = ['A', 'B', 'C', 'D', '.'];
function itemStats(rows) {
  const n = rows.length; if (n < 10) return null;
  const sorted = [...rows].sort((a, b) => b.score - a.score);
  const k = Math.max(1, Math.floor(.27 * n));
  const up = sorted.slice(0, k), lo = sorted.slice(n - k);
  const tot = rows.map(r => r.score);
  return ITEMS.map((it, q) => {
    const x = rows.map(r => r.corr[q]);
    const rest = tot.map((t, i) => t - x[i]);
    const p = mean(x);
    const ans = rows.filter(r => r.resp[q] !== '.');
    const dist = {}, dU = {}, dL = {};
    for (const o of OPTS) { dist[o] = 0; dU[o] = 0; dL[o] = 0; }
    for (const r of rows) dist[r.resp[q]] = (dist[r.resp[q]] || 0) + 1;
    for (const r of up) dU[r.resp[q]]++;
    for (const r of lo) dL[r.resp[q]]++;
    for (const o of OPTS) { dist[o] /= n; dU[o] /= k; dL[o] /= k; }
    const D = mean(up.map(r => r.corr[q])) - mean(lo.map(r => r.corr[q]));
    const r = pearson(x, rest);
    const pAns = ans.length ? ans.filter(a => a.resp[q] === it.key).length / ans.length : NaN;
    // status rules exactly as Zerone's item-analysis report defines them
    let status = 'good';
    if (p > .85) status = 'too easy';
    else if (p < .20) status = 'very hard';
    else if (D < .20 && p >= .30 && p <= .70) status = 'review';
    else if (p < .30 || D < .30) status = 'watch';
    const notes = [];
    for (const o of ['A', 'B', 'C', 'D']) {
      if (o === it.key) continue;
      if (dist[o] < .03) notes.push(`${o} rarely chosen (${P(dist[o], 0)})`);
      if (dU[o] - dL[o] > .05) notes.push(`${o} attracts the upper group more than the lower (${P(dU[o], 0)} vs ${P(dL[o], 0)})`);
    }
    if (r < .15) notes.push(`low item–rest correlation (r = ${F(r)})`);
    return { ...it, idx: q, p, pAns, D, r, dist, dU, dL, blank: dist['.'], status, notes };
  });
}
const itemsFor = (adm, f) => A(adm, 'it:' + f.school + '|' + f.grade + '|' + f.cls, () => itemStats(subsetRows(adm, f)));
function statusClass(s) { return s === 'good' ? 'good' : s === 'watch' ? 'watch' : s === 'review' ? 'review' : s === 'too easy' ? 'easy' : 'hard'; }

// ---------- interpretive rules ----------------------------------------------
// Student: first max / first min over the nine skills in blueprint order (same rule as the reconciled pack).
function studentStrengthFocus(r) {
  let hi = SKILLS[0], lo = SKILLS[0];
  for (const s of SKILLS) { if (r.sk[s.id] > r.sk[hi.id]) hi = s; if (r.sk[s.id] < r.sk[lo.id]) lo = s; }
  return { hi, lo };
}
// School: three lowest / highest skills (absolute) and three furthest from the Network Reference (relative).
function schoolProfile(a, N) {
  const arr = SKILLS.map(s => ({ s, v: a.sk[s.id], diff: a.sk[s.id] - N.sk[s.id] }));
  const byV = [...arr].sort((x, y) => x.v - y.v), byD = [...arr].sort((x, y) => x.diff - y.diff);
  return { lowAbs: byV.slice(0, 3), highAbs: byV.slice(-3).reverse(), lowRel: byD.slice(0, 3), highRel: byD.slice(-3).reverse() };
}
// Is a school's pattern broad or concentrated? (interpretive, threshold ±3 points vs Network Reference)
function patternOf(a, N) {
  const diffs = DOMS.map(d => ({ d, x: a.dom[d.id] - N.dom[d.id] }));
  const below = diffs.filter(z => z.x < -.03), above = diffs.filter(z => z.x > .03);
  if (below.length === 3) return { k: 'broad', t: 'Below reference in all three domains — broad' };
  if (above.length === 3) return { k: 'above', t: 'Above reference in all three domains' };
  if (below.length === 1 && !above.length) return { k: 'conc', t: `Concentrated in ${below[0].d.short}` };
  if (below.length) return { k: 'mixed', t: `Below in ${below.map(z => z.d.short).join(' + ')}; ${above.length ? 'above in ' + above.map(z => z.d.short).join(' + ') : 'others near reference'}` };
  if (above.length) return { k: 'mixed', t: `Above in ${above.map(z => z.d.short).join(' + ')}; others near reference` };
  return { k: 'near', t: 'Near the reference in all three domains' };
}

// ---------- colour scales ----------------------------------------------------
function isDark() {
  const t = document.documentElement.dataset.theme;
  if (t === 'dark') return true; if (t === 'light') return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
function interp(stops, t) {
  t = Math.max(0, Math.min(1, t)); const x = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
  const a = hex2rgb(stops[i]), b = hex2rgb(stops[i + 1]);
  return rgb2hex(a.map((v, j) => v + (b[j] - v) * f));
}
const SEQ_L = ['#eef4fd', '#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];
const SEQ_D = ['#1b2130', '#16304f', '#1c4a7d', '#2560a8', '#3987e5', '#6da7ec', '#9ec5f4', '#cde2fb'];
const DIV_L = { neg: ['#f0efec', '#f8d3bb', '#f0a179', '#e0733f', '#b8501f'], pos: ['#f0efec', '#cfe0f6', '#8fbbee', '#4f94e0', '#1f63b8'] };
const DIV_D = { neg: ['#2e333f', '#5a3a2a', '#8a4d2a', '#c0642c', '#ec8a4e'], pos: ['#2e333f', '#23405f', '#2c5f93', '#3d86d6', '#7fb3f0'] };
function lum(h) { const [r, g, b] = hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; }
const inkOn = bg => lum(bg) > .36 ? '#141a26' : '#ffffff';
// absolute %: 20% → lightest, 90% → darkest
function seqColor(v) { return interp(isDark() ? SEQ_D : SEQ_L, (v - .2) / .7); }
// difference: full colour at ±span
function divColor(x, span = .15) { const s = isDark() ? DIV_D : DIV_L; return x >= 0 ? interp(s.pos, x / span) : interp(s.neg, -x / span); }
function cellStyle(bg) { return `background:${bg};color:${inkOn(bg)}`; }
function scaleLegend(basis, span = .15) {
  const n = 12, sw = [];
  for (let i = 0; i < n; i++) { const t = i / (n - 1); sw.push(basis === 'abs' ? seqColor(.2 + t * .7) : divColor(-span + 2 * span * t, span)); }
  const lo = basis === 'abs' ? '≤20%' : `−${Math.round(span * 100)} pts`, hi = basis === 'abs' ? '≥90%' : `+${Math.round(span * 100)} pts`;
  return `<div class="scale"><span>${lo}</span><span class="sw">${sw.map(c => `<span style="background:${c}"></span>`).join('')}</span><span>${hi}</span>
  <span>${basis === 'abs' ? 'Colour = % correct (sequential, one hue)' : 'Colour = difference from the Network Reference (orange below · blue above · grey ≈ equal)'}. Values are always printed.</span></div>`;
}

/* ============================================================================
   EASE Growth dashboard — state, shell and views.
   ========================================================================== */

// ---------- state ------------------------------------------------------------
const LOCK = DATA.lock || null;
const S = {
  tab: 'overview',
  mode: LOCK ? 'school' : store.get('mode', 'board'),
  focus: LOCK ? LOCK.school : store.get('focus', SCHOOLS[0]),
  adminId: ADMINS[0].id,
  f: { school: '', grade: '', cls: '', domain: '', skill: '' },
  anon: false,
  heatBasis: 'diff', landSort: { k: 'name', dir: 1 },
  itemView: 'school', itemBasis: 'abs', itemF: { cog: '', level: '', status: '', p: '', d: '' }, itemSort: { k: 'q', dir: 1 },
  bands: '10', rapid: 25,
  sid: null, stuSchool: '', stuGrade: '', stuCls: '', stuQ: '', stuBand: null, family: false,
  lens: 'abs', cmp: [], drawerQ: null, drawerSchool: '',
  gFrom: null, gTo: null,
};
if (!SCHOOLS.includes(S.focus)) S.focus = SCHOOLS[0];
const adm = () => ADMINS.find(a => a.id === S.adminId) || ADMINS[0];
const isBoard = () => S.mode === 'board';
function effF() { const f = { ...S.f }; if (!isBoard()) f.school = S.focus; return f; }

// school display names (anonymisation). Codes follow a stable hash, never the rank.
const CODE = (() => { const o = {}; [...SCHOOLS].sort((a, b) => hash(a).localeCompare(hash(b))).forEach((s, i) => o[s] = 'School ' + String.fromCharCode(65 + i)); return o; })();
function sn(s) {
  if (LOCK) return s; // anonymised file: other schools already carry codes
  if (!isBoard()) return s === S.focus ? s : CODE[s];
  return S.anon ? CODE[s] : s;
}

const TABS = [
  { id: 'overview', t: 'Overview' },
  { id: 'landscape', t: 'School landscape' },
  { id: 'school', t: 'School profile' },
  { id: 'distribution', t: 'Distribution' },
  { id: 'grades', t: 'Grade 7 vs 8' },
  { id: 'students', t: 'Students & families' },
  { id: 'items', t: 'Item lab', board: 1 },
  { id: 'quality', t: 'Assessment quality', board: 1 },
  { id: 'engagement', t: 'Engagement', board: 1 },

// ---------- glossary ---------------------------------------------------------
const GL = {
  baseline: 'Baseline — the starting measurement before any later Growth comparison. Growth I is a baseline only.',
  ref: 'Network Reference — the average of the current network sample (960 finished sessions). A comparison point, not an expected standard.',
  strength: 'Relative strength — a comparatively stronger area within this profile. Not necessarily mastery.',
  priority: 'Development priority — an area with lower performance, worth further instructional attention and investigation.',
  blank: 'Blank % — share of item responses left unanswered among finished sessions. Blanks count as not correct.',
  kr20: 'KR-20 — internal consistency of the whole 54-item test (0–1). Around 0.8–0.9 is strong for a test of this length.',
  sem: 'SEM — standard error of measurement: the approximate uncertainty around one student\'s observed raw score (in items).',
  p: 'Item difficulty (p) — proportion of the 960 finished sessions answering the item correctly (blank = not correct).',
  D: 'Discrimination (D) — correct rate in the top 27% of students minus the bottom 27%. 0.40+ very good, 0.30–0.39 good, 0.20–0.29 fair, below 0.20 poor.',
  r: 'Item–rest correlation — correlation between the item and the score on the other 53 items. Low or negative values suggest a flawed item.',
  ci: '95% confidence interval — the range within which the school mean is likely to lie given its sample size. Overlapping intervals mean schools cannot be told apart statistically.',
  expected: 'Grade-mix expectation (Zerone model) — the network Grade 7 and Grade 8 means weighted by the school\'s own grade mix. Corrects grade mix only; not prior attainment, context or supervision.',
  d: 'Effect size d — the difference from the grade-mix expectation divided by the student-level SD.',
  rapid: 'Possible rapid completion — finishing well under the time available. An engagement check for follow-up, never evidence of misconduct.',
  eta: 'Between-school share of variance — the part of the total student variation that lies between school means (eta squared).',
  skill6: 'Each skill is measured by 6 questions — an initial diagnostic indication, not a mastery judgement or a validated subscore.',
  band: 'Score intervals are descriptive only. No standard-setting has been done, so they are not proficiency levels.',
};
const gi = k => `<button class="gi" aria-label="Explain" data-tip="${attr(GL[k])}">i</button>`;
const TAG = { m: '<span class="tag m" data-tip="Measured — taken directly from the responses.">Measured</span>', d: '<span class="tag d" data-tip="Derived — a statistic calculated from the responses.">Derived</span>', i: '<span class="tag i" data-tip="Interpretive — a rule-based suggestion for professional judgement.">Interpretive</span>', z: '<span class="tag z" data-tip="Reported by Zerone; not recomputable from the export.">Zerone</span>' };

// ---------- small render helpers ---------------------------------------------
function kpi(label, val, sub, o = {}) {
  return `<div class="card kpi ${o.alert ? 'alert' : ''}" style="--acc:${o.c || 'var(--brand)'}" ${o.tip ? `data-tip="${attr(o.tip)}"` : ''}>
    <div class="lbl">${label}${o.g ? gi(o.g) : ''}</div><div class="val tn">${val}</div><div class="sub">${sub || ''}</div></div>`;
}
function secH(t, p, tags = '') { return `<div class="sec-h"><h2>${t}</h2>${tags}${p ? `<p>${p}</p>` : ''}</div>`; }
function pos(v, min, max) { return Math.max(0, Math.min(100, (v - min) / (max - min) * 100)); }
/* rows: [{lab, labHtml, marks:[...], val, sub, tip, act, v}]  marks: bar|ref|dot|rng|box */
function rowChart(rows, o = {}) {
  const min = o.min ?? 0, max = o.max ?? 1;
  const zero = pos(0, min, max);
  const body = rows.map(r => {
    const m = (r.marks || []).map(k => {
      const c = k.c ? `--c:${k.c};` : '';
      if (k.t === 'bar') {
        if (min < 0) { const a = pos(Math.min(0, k.v), min, max), b = pos(Math.max(0, k.v), min, max); return `<span class="bar-f ${k.v < 0 ? 'neg' : ''}" style="${c}left:${a}%;width:${b - a}%"></span>`; }
        return `<span class="bar-f" style="${c}width:${pos(k.v, min, max)}%"></span>`;
      }
      if (k.t === 'ref') return `<span class="refk" style="left:${pos(k.v, min, max)}%"></span>`;
      if (k.t === 'dot') return `<span class="dot ${k.cls || ''}" style="${c}left:${pos(k.v, min, max)}%"></span>`;
      if (k.t === 'rng') { const a = pos(Math.min(k.a, k.b), min, max), b = pos(Math.max(k.a, k.b), min, max); return `<span class="rng" style="${c}left:${a}%;width:${b - a}%"></span>`; }
      if (k.t === 'box') { const a = pos(k.a, min, max), b = pos(k.b, min, max); return `<span class="rng" style="${c}left:${pos(k.lo, min, max)}%;width:${pos(k.hi, min, max) - pos(k.lo, min, max)}%;height:1.5px;opacity:.8"></span><span class="box" style="${c}left:${a}%;width:${b - a}%"></span><span class="boxl" style="${c}left:${a}%;width:${b - a}%"></span><span class="med" style="left:${pos(k.med, min, max)}%"></span>`; }
      return '';
    }).join('');
    const act = r.act ? `data-act="${r.act}" data-v="${attr(r.v)}"` : '';
    return `<div class="lab ${o.wrap ? 'wrap' : ''} ${r.act ? 'clickable' : ''}" ${act} title="${attr(r.lab)}">${r.labHtml || esc(r.lab)}</div>
      <div class="trk ${r.act ? 'clickable' : ''}" ${act} ${r.tip ? `data-tip="${attr(r.tip)}"` : ''}>${min < 0 ? `<span class="refk" style="left:${zero}%;opacity:.35"></span>` : ''}${m}</div>
      <div class="v">${r.val ?? ''}${r.sub ? `<small>${r.sub}</small>` : ''}</div>`;
  }).join('');
  const ticks = o.ticks || (min < 0 ? [min, min / 2, 0, max / 2, max] : [0, .25, .5, .75, 1].map(t => min + t * (max - min)));
  const fmt = o.tfmt || (v => min < 0 ? PTS(v, 0) : Math.round(v * 100) + '%');
  return `<div class="rc" style="${o.lw ? `--lw:${o.lw}px;` : ''}${o.vw ? `--vw:${o.vw}px;` : ''}${o.th ? `--th:${o.th}px;` : ''}">${body}
    <div></div><div class="axis">${ticks.map(t => `<span>${fmt(t)}</span>`).join('')}</div><div></div></div>`;
}
function legend(items) { return `<div class="legend">${items.map(([k, c, t]) => `<span><i class="${k}" style="background:${c}"></i>${t}</span>`).join('')}</div>`; }
const dchip = d => `<span class="dchip" style="--dc:${DCOL[d]}"><i></i>${esc(DOM[d].short)}</span>`;
function svgHist(bins, o = {}) {
  const W = o.w || 640, H = o.h || 210, L = 38, R = 10, T = 12, B = 34, w = (W - L - R) / bins.length;
  const raw = o.ymax || Math.max(...bins.map(b => Math.max(b.v, b.ref || 0))) * 1.05 || 1;
  const step = (() => { const r = raw / 4, m = 10 ** Math.floor(Math.log10(r)); return [1, 2, 2.5, 5, 10].map(k => k * m).find(k => k >= r); })();
  const ymax = step * 4;
  const y = v => T + (H - T - B) * (1 - v / ymax);
  const grid = [0, 1, 2, 3, 4].map(t => { const v = step * t; return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${o.yfmt ? o.yfmt(v) : +v.toFixed(3)}</text>`; }).join('');
  const bars = bins.map((b, i) => {
    const x = L + i * w + 1, bw = Math.max(1, w - 2), h = Math.max(0, y(0) - y(b.v));
    const rf = isNum(b.ref) ? `<line x1="${x}" x2="${x + bw}" y1="${y(b.ref)}" y2="${y(b.ref)}" stroke="var(--ref)" stroke-width="2"/>` : '';
    const lab = (o.every ? i % o.every === 0 : true) ? `<text x="${x + bw / 2}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(b.label)}</text>` : '';
    return `<g ${b.act ? `data-act="${b.act}" data-v="${attr(b.v2 ?? i)}" style="cursor:pointer"` : ''} data-tip="${attr(b.tip || '')}"><rect x="${x}" y="${y(0) - h}" width="${bw}" height="${h}" rx="${Math.min(4, bw / 2)}" fill="${b.c || o.c || 'var(--brand)'}" ${b.dim ? 'opacity=".35"' : ''}/>${rf}<rect x="${x}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/></g>${lab}`;
  }).join('');
  const xl = o.xlab ? `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${esc(o.xlab)}</text>` : '';
  const vl = (o.vlines || []).map(v => `<line x1="${L + v.at * (W - L - R)}" x2="${L + v.at * (W - L - R)}" y1="${T}" y2="${H - B}" stroke="${v.c || 'var(--caution)'}" stroke-width="2" stroke-dasharray="4 3"/><text x="${L + v.at * (W - L - R) + 4}" y="${T + 10}" font-size="10.5" fill="${v.c || 'var(--caution)'}" font-weight="700">${esc(v.t)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${attr(o.aria || 'histogram')}"><line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${grid}${bars}${vl}${xl}</svg>`;
}
function svgScatter(pts, o) {
  const W = 640, H = o.h || 300, L = 44, R = 14, T = 14, B = 38;
  const x = v => L + (W - L - R) * (v - o.x0) / (o.x1 - o.x0), y = v => T + (H - T - B) * (1 - (v - o.y0) / (o.y1 - o.y0));
  const gx = (o.xt || []).map(v => `<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - B}" stroke="var(--grid)"/><text x="${x(v)}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="var(--muted)">${o.xf ? o.xf(v) : v}</text>`).join('');
  const gy = (o.yt || []).map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${o.yf ? o.yf(v) : v}</text>`).join('');
  const refs = (o.hline != null ? `<line x1="${L}" x2="${W - R}" y1="${y(o.hline)}" y2="${y(o.hline)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="5 4"/>` : '') + (o.vline != null ? `<line x1="${x(o.vline)}" x2="${x(o.vline)}" y1="${T}" y2="${H - B}" stroke="var(--caution)" stroke-width="1.5" stroke-dasharray="5 4"/>` : '');
  const dots = pts.map(p => `<g ${p.act ? `data-act="${p.act}" data-v="${attr(p.v)}" style="cursor:pointer"` : ''} data-tip="${attr(p.tip)}"><circle cx="${x(p.x)}" cy="${y(p.y)}" r="${p.r || 5}" fill="${p.c || 'var(--brand)'}" fill-opacity="${p.op ?? .8}" stroke="var(--surface)" stroke-width="2"/>${p.lab ? `<text x="${x(p.x) + (p.r || 5) + 3}" y="${y(p.y) + 3.5}" font-size="10.5" fill="var(--ink-2)">${esc(p.lab)}</text>` : ''}</g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${attr(o.aria || 'scatter')}">${gx}${gy}${refs}${dots}
   <text x="${(L + W - R) / 2}" y="${H - 5}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${esc(o.xlab || '')}</text>
   <text transform="translate(12 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${esc(o.ylab || '')}</text></svg>`;
}
function statusChip(st) { return `<span class="fl ${statusClass(st)}">${esc(st)}</span>`; }

VIEWS.landscape = () => {
  const a = adm(), N = net(a), basis = S.heatBasis;
  const g = S.f.grade;
  const aggFor = s => g ? agg(a.fin.filter(r => r.school === s && r.grade === +g)) : schoolAgg(a, s);
  const NN = g ? agg(a.fin.filter(r => r.grade === +g)) : N;
  const cols = [{ k: 'overall', lab: 'Overall', get: x => x.mean, dom: '' }, ...DOMS.map(d => ({ k: d.id, lab: d.short, get: x => x.dom[d.id], dom: d.id })),
    ...SKILLS.map(s => ({ k: s.id, lab: s.short, full: s.name, get: x => x.sk[s.id], dom: s.domain, skill: 1 }))]
    .filter(c => !S.f.domain || c.dom === S.f.domain || c.k === 'overall').filter(c => !S.f.skill || !c.skill || c.k === S.f.skill);
  let rows = SCHOOLS.map(s => ({ s, x: aggFor(s) })).filter(r => r.x.n);
  const sk = S.landSort;
  rows.sort((p, q) => sk.k === 'name' ? sn(p.s).localeCompare(sn(q.s)) * sk.dir : sk.k === 'n' ? (p.x.n - q.x.n) * sk.dir : (cols.find(c => c.k === sk.k).get(p.x) - cols.find(c => c.k === sk.k).get(q.x)) * sk.dir);
  const cell = (s, c, x) => {
    const v = c.get(x), r = c.get(NN), bg = basis === 'abs' ? seqColor(v) : divColor(v - r);
    const lab = basis === 'abs' ? PN(v, 0) : PTS(v - r, 0);
    return `<td style="${cellStyle(bg)}" data-act="goSchool" data-v="${attr(s)}" data-tip="<b>${attr(sn(s))}</b> · ${attr(c.dom ? DOM[c.dom].short + ' — ' : '')}${attr(c.lab)}<br>School ${P(v)} · Network ${P(r)}<br>Difference ${PTS(v - r)} pts · n = ${x.n}${c.skill ? '<br><span class=tm>6 questions — initial indication</span>' : ''}">${lab}</td>`;
  };
  const th = c => `<th class="rot s" data-act="lsort" data-v="${c.k}"><div>${esc(c.lab)}${sk.k === c.k ? (sk.dir > 0 ? ' ▲' : ' ▼') : ''}</div></th>`;
  const grpRow = `<tr><th></th><th></th><th></th>${DOMS.filter(d => cols.some(c => c.dom === d.id && !c.skill)).map(d => `<th class="grp" style="--gc:${DCOL[d.id]}"></th>`).join('')}${DOMS.map(d => { const n = cols.filter(c => c.skill && c.dom === d.id).length; return n ? `<th class="grp" colspan="${n}" style="--gc:${DCOL[d.id]}">${esc(d.name)} skills</th>` : ''; }).join('')}<th></th></tr>`;
  const table = `<table class="hm"><thead>${grpRow}<tr><th class="l s" data-act="lsort" data-v="name" style="text-align:left">School ${sk.k === 'name' ? (sk.dir > 0 ? '▲' : '▼') : ''}</th><th class="s" data-act="lsort" data-v="n">n</th>${cols.map(th).join('')}<th class="l">Pattern ${TAG.i}</th></tr></thead><tbody>
    <tr class="net"><td class="nm">Network Reference${g ? ' · G' + g : ''}</td><td class="tn">${NN.n}</td>${cols.map(c => { const v = c.get(NN); const bg = basis === 'abs' ? seqColor(v) : (isDark() ? '#2e333f' : '#f0efec'); return `<td style="${cellStyle(bg)}" data-tip="Network Reference · ${attr(c.lab)}: ${P(v)}">${PN(v, 0)}</td>`; }).join('')}<td class="pat"></td></tr>
    ${rows.map(({ s, x }) => `<tr><td class="nm" data-act="goSchool" data-v="${attr(s)}">${esc(sn(s))}${!isBoard() && s === S.focus ? ' ★' : ''}</td><td class="tn" style="font-weight:500;cursor:default">${x.n}</td>${cols.map(c => cell(s, c, x)).join('')}<td class="pat">${esc(patternOf(x, NN).t)}</td></tr>`).join('')}
  </tbody></table>`;
  // small multiples — nine-skill profile per school
  const sm = rows.map(({ s, x }) => `<div class="card" style="padding:12px 14px"><div class="row" style="margin-bottom:6px"><button class="link" data-act="goSchool" data-v="${attr(s)}">${esc(sn(s))}</button><span class="spacer"></span><span class="small muted tn">n ${x.n} · ${P(x.mean)}</span></div>
    ${rowChart(SKILLS.filter(k => !S.f.domain || k.domain === S.f.domain).map(k => ({ lab: k.dshort[0] + ' · ' + k.short, marks: [{ t: 'bar', v: x.sk[k.id], c: DCOL[k.domain] }, { t: 'ref', v: NN.sk[k.id] }], val: PN(x.sk[k.id], 0), tip: `<b>${attr(sn(s))}</b><br>${attr(k.dshort)} — ${attr(k.name)}: ${P(x.sk[k.id])}<br>Network ${P(NN.sk[k.id])} (${PTS(x.sk[k.id] - NN.sk[k.id])})` })), { lw: 150, vw: 34, th: 12 })}</div>`).join('');
  return `${secH('School performance landscape', 'Rows are schools, columns are the overall score, the three domains and the nine Growth skills. Click any cell to open that school.', TAG.d)}
  <div class="card"><div class="row"><div class="chip ${basis === 'diff' ? 'on' : ''}" data-act="basis" data-v="diff">Difference from Network Reference</div><div class="chip ${basis === 'abs' ? 'on' : ''}" data-act="basis" data-v="abs">Absolute % correct</div><span class="spacer"></span><button class="btn sm" data-act="csv" data-v="schools">Export CSV</button></div>
  ${scaleLegend(basis)}<div class="tw">${table}</div>
  <p class="note">"Pattern" marks a domain as above/below when the school differs from the Network Reference by more than 3 points — a reading aid, not a statistical test. Skill cells rest on 6 questions each. ${g ? `Filtered to Grade ${g}; the reference is the Grade ${g} network mean.` : ''}</p></div>
  ${secH('Nine-skill profile, school by school', 'Bars = school; the dark tick = Network Reference. The same shape repeating across schools means a network pattern, not a school-specific one.')}
  <div class="grid g3">${sm}</div>`;
};

const SUGGEST_OWNER = 'Subject Leader / Teacher Team';
const SUGGEST_REVIEW = 'Before Growth II — April 2027';
function curSchool() { return isBoard() ? (S.f.school || S.focus) : S.focus; }
function actionKey(s) { return `actions:${S.adminId}:${s}:${S.lens}`; }
function schoolActions(s) {
  const a = adm(), N = net(a), x = schoolAgg(a, s), pr = schoolProfile(x, N);
  const list = S.lens === 'abs' ? pr.lowAbs : pr.lowRel;
  const saved = store.get(actionKey(s), null);
  return list.map((p, i) => {
    const g7 = agg(a.fin.filter(r => r.school === s && r.grade === 7)), g8 = agg(a.fin.filter(r => r.school === s && r.grade === 8));
    const ev = `School ${P(p.v)} · Network ${P(N.sk[p.s.id])} (${PTS(p.diff)} pts)${g7.n ? ` · G7 ${P(g7.sk[p.s.id], 0)}` : ''}${g8.n ? ` · G8 ${P(g8.sk[p.s.id], 0)}` : ''} · 6 questions, n = ${x.n}`;
    const sv = saved && saved[i] && saved[i].skill === p.s.id ? saved[i] : null;
    return { skill: p.s.id, priority: `${p.s.dshort} — ${p.s.name}`, evidence: ev, response: sv?.response ?? p.s.action, owner: sv?.owner ?? SUGGEST_OWNER, review: sv?.review ?? SUGGEST_REVIEW, decision: sv?.decision ?? '' };
  });
}

VIEWS.distribution = () => {
  const a = adm(), N = net(a), f = effF(), X = subsetAgg(a, f);
  const list = isBoard() ? SCHOOLS : [S.focus];
  const four = S.bands === '4';
  const bandLab = four ? ['Below 40%', '40–59%', '60–79%', '80% and above'] : Array.from({ length: 10 }, (_, i) => `${i * 10}–${i === 9 ? 100 : i * 10 + 9}%`);
  const bandsOf = x => four ? x.bands4 : x.bands10;
  const shades = four ? ['#b9d3f4', '#7aaeea', '#3987e5', '#184f95'] : SEQ_L.slice(0).concat(['#0a2a55', '#061c3a']).slice(0, 10);
  const shadeD = four ? ['#1c4a7d', '#2560a8', '#4f94e0', '#9ec5f4'] : ['#172335', '#16304f', '#1c4a7d', '#2560a8', '#2f72c4', '#3987e5', '#5598e7', '#6da7ec', '#9ec5f4', '#cde2fb'];
  const sh = isDark() ? shadeD : shades;
  const stack = x => `<div style="display:flex;height:18px;border-radius:4px;overflow:hidden;gap:2px">${bandsOf(x).map((c, i) => c ? `<span style="flex:${c};background:${sh[i]}" data-tip="<b>${bandLab[i]}</b><br>${c} students · ${P(c / x.n, 0)}"></span>` : '').join('')}</div>`;

function itemFilterPass(it) {
  const f = S.itemF;
  if (S.f.domain && it.domain !== S.f.domain) return false;
  if (S.f.skill && it.skill !== S.f.skill) return false;
  if (f.cog && it.cog !== f.cog) return false;
  if (f.level && it.level !== +f.level) return false;
  if (f.status && it.status !== f.status) return false;
  if (f.p === 'lo' && !(it.p < .3)) return false;
  if (f.p === 'mid' && !(it.p >= .3 && it.p <= .7)) return false;
  if (f.p === 'hi' && !(it.p > .7)) return false;
  if (f.d === 'poor' && !(it.D < .2)) return false;
  if (f.d === 'fair' && !(it.D >= .2 && it.D < .3)) return false;
  if (f.d === 'good' && !(it.D >= .3)) return false;
  return true;
}

      <tr class="net"><td class="nm">Network Reference</td>${order.map(q => `<td style="background:${seqColor(N.p[q])}" data-act="item" data-v="${q}" data-tip="<b>Q${q + 1}</b> network p = ${F(N.p[q])}"></td>`).join('')}</tr>

  } else if (S.itemView === 'grade') {

      ${G7.n && G8.n ? `<tr><td class="nm">G8 − G7</td>${order.map(q => `<td style="background:${divColor(G8.p[q] - G7.p[q], .25)}" data-act="item" data-v="${q}" data-tip="<b>Q${q + 1}</b> G8 − G7 = ${PTS(G8.p[q] - G7.p[q], 0)} pts"></td>`).join('')}</tr>` : ''}</tbody></table>
      <p class="small muted">The G8 − G7 row always uses the difference scale (blue = Grade 8 higher, orange = Grade 7 higher). An item where Grade 8 is clearly below Grade 7 deserves a look at how the older group read it.</p>`;
  } else {
    heat = `<div class="grid g3">${DOMS.filter(d => !S.f.domain || d.id === S.f.domain).map(d => `<div><div class="dchip" style="--dc:${DCOL[d.id]};margin-bottom:6px"><i></i>${esc(d.name)}</div><table class="hm"><tbody>${d.skills.filter(s => !S.f.skill || s.id === S.f.skill).map(s => `<tr><td class="nm" style="min-width:120px;white-space:normal;font-size:11.5px" data-act="goSkill" data-v="${s.id}">${esc(s.name)}</td>${s.items.map(q => { const it = st[q - 1], bg = cellC(it.p, Nst[q - 1].p); return `<td style="${cellStyle(bg)};${visSet.has(q - 1) ? '' : 'opacity:.25'}" data-act="item" data-v="${q - 1}" data-tip="<b>Q${q}</b> · p ${F(it.p)} · D ${F(it.D)}<br>${attr(it.status)}">Q${q}<br><span style="font-weight:500">${PN(it.p, 0)}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
  }
  const sk = S.itemSort, cols = [['q', 'Q'], ['qid', 'ID'], ['key', 'Key'], ['domain', 'Domain'], ['skill', 'Growth skill'], ['cog', 'Cognitive (Zerone)'], ['level', 'Level'], ['p', 'p'], ['D', 'D'], ['r', 'r (item–rest)'], ['A', 'A %'], ['B', 'B %'], ['C', 'C %'], ['Dp', 'D %'], ['blank', 'Blank %'], ['g7', 'G7 p'], ['g8', 'G8 p'], ['status', 'Status']];
  const G7 = agg(subsetRows(a, { ...f, grade: '7' })), G8 = agg(subsetRows(a, { ...f, grade: '8' }));
  const val = (it, k) => k === 'q' ? it.q : k === 'A' || k === 'B' || k === 'C' ? it.dist[k] : k === 'Dp' ? it.dist.D : k === 'g7' ? G7.p?.[it.idx] : k === 'g8' ? G8.p?.[it.idx] : k === 'skill' ? SK[it.skill].name : it[k];
  const rows = [...vis].sort((x, y) => { const p = val(x, sk.k), q = val(y, sk.k); return (typeof p === 'string' ? p.localeCompare(q) : (p ?? -9) - (q ?? -9)) * sk.dir; });
  const fsel = (name, opts, v, lab) => `<label>${lab}<select data-f="${name}">${opts.map(([o, t]) => `<option value="${o}" ${String(o) === String(v) ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  const counts = Object.entries(st.reduce((m, i) => (m[i.status] = (m[i.status] || 0) + 1, m), {}));
  return `${secH('Item lab', `${vis.length} of 54 items shown · statistics for ${esc(f.school ? sn(f.school) : 'the network')}${f.grade ? ' · Grade ' + f.grade : ''} (n = ${subsetRows(a, f).length}).`, TAG.d)}
  <div class="card"><div class="filters" style="padding:0;border:0">
    ${fsel('iCog', [['', 'All'], ...COGS.map(c => [c, c])], S.itemF.cog, 'Cognitive')}
    ${fsel('iLevel', [['', 'All'], ['1', 'Level 1'], ['2', 'Level 2'], ['3', 'Level 3']], S.itemF.level, 'Level')}
    ${fsel('iStatus', [['', 'All'], ['good', 'good'], ['watch', 'watch'], ['review', 'review'], ['too easy', 'too easy'], ['very hard', 'very hard']], S.itemF.status, 'Status')}
    ${fsel('iP', [['', 'Any'], ['lo', 'Hard (p < 0.30)'], ['mid', 'Medium (0.30–0.70)'], ['hi', 'Easy (p > 0.70)']], S.itemF.p, 'Difficulty p')}
    ${fsel('iD', [['', 'Any'], ['poor', 'Poor (< 0.20)'], ['fair', 'Fair (0.20–0.29)'], ['good', 'Good+ (≥ 0.30)']], S.itemF.d, 'Discrimination D')}
    <span class="fnote">${counts.map(([k, v]) => `${statusChip(k)} ${v}`).join(' ')}</span></div></div>
  <div class="card" style="margin-top:14px"><div class="row"><h2 style="margin:0">54-item heatmap</h2><span class="spacer"></span>
    <span class="chip ${S.itemView === 'school' ? 'on' : ''}" data-act="iview" data-v="school">School × item</span><span class="chip ${S.itemView === 'skill' ? 'on' : ''}" data-act="iview" data-v="skill">Skill × item</span><span class="chip ${S.itemView === 'grade' ? 'on' : ''}" data-act="iview" data-v="grade">Grade × item</span>
    <span style="width:10px"></span><span class="chip ${basis === 'abs' ? 'on' : ''}" data-act="ibasis" data-v="abs">% correct</span><span class="chip ${basis === 'diff' ? 'on' : ''}" data-act="ibasis" data-v="diff">vs network</span></div>
    ${scaleLegend(basis, basis === 'abs' ? .15 : .25).replace('Values are always printed.', S.itemView === 'skill' ? 'Values are printed.' : 'Hover a cell for the value; the item table below prints every value.')}<div class="tw">${heat}</div>
    <p class="small muted">Click any cell or column number to open the item. A column of one colour across every school means the item is hard or easy for everyone, not school-specific.</p></div>
  <div class="card" style="margin-top:14px"><div class="row"><h2 style="margin:0">Item table</h2>${gi('p')}${gi('D')}${gi('r')}<span class="spacer"></span><button class="btn sm" data-act="csv" data-v="items">Export CSV</button><button class="btn sm" data-act="print" data-v="items">Print item analysis</button></div>
    <div class="tw" style="--mh:560px;margin-top:8px"><table class="t"><thead><tr>${cols.map(([k, t]) => `<th class="s ${['qid', 'key', 'domain', 'skill', 'cog', 'status'].includes(k) ? 'l' : ''}" data-act="isort" data-v="${k}">${t}${sk.k === k ? (sk.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}<th class="l">Signals</th></tr></thead><tbody>
    ${rows.map(it => `<tr class="clickable" data-act="item" data-v="${it.idx}" style="cursor:pointer"><td><b>Q${it.q}</b></td><td class="l">${esc(it.qid)}</td><td class="l"><b>${it.key}</b></td><td class="l">${dchip(it.domain)}</td><td class="l">${esc(SK[it.skill].name)}</td><td class="l">${esc(it.cog)}</td><td>${it.level}</td>
      <td>${F(it.p)}</td><td>${F(it.D)}</td><td>${F(it.r)}</td>${['A', 'B', 'C', 'D'].map(o => `<td style="${o === it.key ? 'font-weight:700;color:var(--good)' : ''}">${PN(it.dist[o], 0)}</td>`).join('')}<td>${PN(it.blank, 1)}</td><td>${F(G7.p?.[it.idx])}</td><td>${F(G8.p?.[it.idx])}</td><td class="l">${statusChip(it.status)}</td><td class="l small muted" style="white-space:normal;min-width:300px">${esc(it.notes.join(' · '))}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note">Status rules are Zerone's: <b>too easy</b> p &gt; 0.85 · <b>very hard</b> p &lt; 0.20 · <b>review</b> D &lt; 0.20 at medium difficulty · <b>watch</b> p &lt; 0.30 or D &lt; 0.30 · <b>good</b> otherwise. Signals are dashboard rules: a distractor chosen by under 3%, a distractor chosen more by the upper 27% than the lower 27% (by more than 5 points), and item–rest r below 0.15. p uses the fixed 960 denominator (blank = not correct); Zerone's item-analysis report prints p over answered responses instead, which runs slightly higher.</p></div>`;
};

// item drawer
function openItem(q, silent) {
  const a = adm(), f = effF(), st = itemsFor(a, f), Nst = itemsFor(a, { school: '', grade: '', cls: '' });
  if (!st) return;
  S.drawerQ = q;
  const it = st[q], N = net(a);
  const sch = S.drawerSchool;
  const sd = sch ? itemStats(a.fin.filter(r => r.school === sch)) : null;
  const G7 = itemStats(subsetRows(a, { ...f, grade: '7' })), G8 = itemStats(subsetRows(a, { ...f, grade: '8' }));
  const optBlock = (lab, x) => x ? `<h3>${lab}</h3>${['A', 'B', 'C', 'D', '.'].map(o => `<div class="opt"><span class="ol ${o === it.key ? 'k' : ''}">${o === '.' ? '—' : o}</span><div class="trk" style="--th:14px"><span class="bar-f" style="--c:${o === it.key ? 'var(--good)' : o === '.' ? 'var(--muted)' : 'var(--ink-2)'};width:${x.dist[o] * 100}%"></span></div><span class="tn small" style="text-align:right">${P(x.dist[o], 0)}</span></div>`).join('')}` : '';
  const ud = `<h3>Upper 27% vs lower 27% ${gi('D')}</h3><table class="t"><thead><tr><th class="l">Option</th><th>Upper</th><th>Lower</th><th>Upper − lower</th></tr></thead><tbody>${['A', 'B', 'C', 'D', '.'].map(o => `<tr style="${o === it.key ? 'font-weight:700' : ''}"><td class="l">${o === '.' ? 'Blank' : o}${o === it.key ? ' (key)' : ''}</td><td>${P(it.dU[o], 0)}</td><td>${P(it.dL[o], 0)}</td><td style="color:${o !== it.key && it.dU[o] - it.dL[o] > .05 ? 'var(--critical)' : 'inherit'}">${PTS(it.dU[o] - it.dL[o], 0)}</td></tr>`).join('')}</tbody></table>`;
  const schoolP = rowChart([...SCHOOLS].sort((x, y) => schoolAgg(a, y).p[q] - schoolAgg(a, x).p[q]).map(s => ({ lab: sn(s), marks: [{ t: 'bar', v: schoolAgg(a, s).p[q], c: DCOL[it.domain] }, { t: 'ref', v: N.p[q] }], val: P(schoolAgg(a, s).p[q], 0), act: 'drawerSchool', v: s, tip: `${attr(sn(s))}: ${P(schoolAgg(a, s).p[q])} · network ${P(N.p[q])}` })), { lw: 170, vw: 44, th: 12 });
  $('#drawer').innerHTML = `<button class="x" data-act="closeDrawer" aria-label="Close">×</button>
   <div class="small muted" style="font-weight:700;letter-spacing:1px;text-transform:uppercase">Item analysis · ${esc(f.school ? sn(f.school) : 'Network')}</div>
   <h2 style="font:700 24px/1.2 var(--serif);margin:2px 0 6px">Question ${it.q} <span class="muted" style="font:500 14px var(--font)">ID ${esc(it.qid)} · key <b style="color:var(--good)">${it.key}</b></span></h2>
   <div class="row">${dchip(it.domain)}<span class="fl info">${esc(SK[it.skill].name)}</span><span class="fl info">${esc(it.cog)}</span><span class="fl info">Level ${it.level}</span>${statusChip(it.status)}</div>
   <div class="grid g4" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px">${[['p', F(it.p), 'p'], ['D', F(it.D), 'D'], ['r item–rest', F(it.r), 'r'], ['Blank', P(it.blank, 1), 'blank'], ['G7 p', F(G7?.[q]?.p), ''], ['G8 p', F(G8?.[q]?.p), ''], ['Network p', F(Nst[q].p), 'p'], ['p (answered only)', F(it.pAns), '']].map(([l, v, g]) => `<div class="small"><div class="muted">${l} ${g ? gi(g) : ''}</div><b class="tn" style="font-size:18px">${v}</b></div>`).join('')}</div>
   ${it.notes.length ? `<div class="note warn"><b>Signals:</b> ${esc(it.notes.join(' · '))}</div>` : ''}
   ${optBlock('Response options — ' + (f.school ? esc(sn(f.school)) : 'network'), it)}
   ${ud}
   <div class="grid g2">${G7 ? `<div>${optBlock('Grade 7', G7[q])}</div>` : ''}${G8 ? `<div>${optBlock('Grade 8', G8[q])}</div>` : ''}</div>
   <h3>Selected school</h3><select data-f="drawerSchool" class="btn"><option value="">— choose —</option>${SCHOOLS.map(s => `<option value="${attr(s)}" ${s === sch ? 'selected' : ''}>${esc(sn(s))}</option>`).join('')}</select>
   ${sd ? optBlock(esc(sn(sch)) + ` (n ${a.fin.filter(r => r.school === sch).length})`, sd[q]) : ''}
   <h3>% correct by school</h3>${schoolP}
   ${it.excerpt ? `<h3>Question excerpt <span class="tag i">Item security</span></h3><p class="small" style="background:var(--surface-2);border-radius:8px;padding:10px 12px">${esc(it.excerpt)}</p>
   <p class="small muted">Excerpt from Zerone's item-analysis report. Items may be reused, so do not copy question text into school-facing material.</p>` : ''}
   <div class="row" style="margin-top:12px"><button class="btn sm" data-act="item" data-v="${Math.max(0, q - 1)}">← Q${Math.max(1, q)}</button><button class="btn sm" data-act="item" data-v="${Math.min(53, q + 1)}">Q${Math.min(54, q + 2)} →</button></div>`;
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open');
  if (!silent) $('#drawer').scrollTop = 0;
}
function closeDrawer() { S.drawerQ = null; $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }

VIEWS.quality = () => {
  const a = adm(), f = effF(), X = subsetAgg(a, f), st = itemsFor(a, f);
  if (!st) return `<div class="card empty"><h3>Too few sessions</h3></div>`;
  const raw = subsetRows(a, f).map(r => r.score);
  const rb = Array.from({ length: 19 }, (_, i) => ({ lo: i * 3, hi: i * 3 + 2 }));
  const pb = Array.from({ length: 10 }, (_, i) => i / 10);
  const db = [-.2, -.1, 0, .1, .2, .3, .4, .5, .6, .7];
  const cnt = Object.fromEntries(['good', 'watch', 'review', 'too easy', 'very hard'].map(k => [k, st.filter(i => i.status === k).length]));
  const cross = COGS.map(c => ({ c, by: DOMS.map(d => st.filter(i => i.cog === c && i.domain === d.id).length), sk: SKILLS.filter(s => s.items.every(q => ITEMS[q - 1].cog === c)).map(s => s.name) }));
  const lvl = [1, 2, 3].map(l => ({ l, by: DOMS.map(d => st.filter(i => i.level === l && i.domain === d.id).length), p: mean(st.filter(i => i.level === l).map(i => i.p)), D: mean(st.filter(i => i.level === l).map(i => i.D)) }));
  const flagged = st.filter(i => i.status !== 'good' || i.notes.length).sort((x, y) => ['review', 'watch', 'very hard', 'too easy', 'good'].indexOf(x.status) - ['review', 'watch', 'very hard', 'too easy', 'good'].indexOf(y.status));
  return `${secH('Assessment quality', `Technical panel for the Academic Board and Subject Specialists — ${esc(f.school ? sn(f.school) : 'network')}${f.grade ? ' · Grade ' + f.grade : ''}. Not for school-facing use until approved.`, TAG.d)}
  <div class="row" style="margin:-4px 0 12px"><button class="btn" data-act="print" data-v="network">Print network technical summary</button></div>
  <div class="grid g-kpi">${kpi('KR-20', F(X.kr20, 3), 'internal consistency', { g: 'kr20', c: 'var(--brand-2)' })}${kpi('SEM', F(X.sem, 2) + ' items', `≈ ±${PN(X.sem / 54)} pts on one score`, { g: 'sem', c: 'var(--brand-2)' })}${kpi('Mean', P(X.mean), `${(X.mean * 54).toFixed(1)} / 54`)}${kpi('Median', P(X.median), '')}${kpi('SD', PN(X.sd) + ' pts', `${F(X.sdRaw)} items`)}${kpi('Sessions', INT(X.n), '')}${kpi('Blank', P(X.blank, 2), '', { g: 'blank', c: 'var(--muted)' })}${kpi('Items to review', cnt.review + cnt.watch, `${cnt.review} review · ${cnt.watch} watch`, { c: 'var(--caution)', alert: cnt.review > 0 })}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Raw score distribution</h2><p class="desc">Items correct out of 54, bins of 3.</p>${svgHist(rb.map(b => { const c = raw.filter(v => v >= b.lo && v <= Math.min(54, b.hi)).length; return { label: `${b.lo}`, v: c, tip: `<b>${b.lo}–${Math.min(54, b.hi)} correct</b><br>${c} students` }; }), { every: 2, xlab: 'items correct', aria: 'Raw score distribution', c: 'var(--brand-2)' })}</div>
    <div class="card"><h2>Difficulty vs discrimination</h2><p class="desc">Each dot is an item. Lower-right items are easy with little information; items below the dashed D line separate students weakly.</p>
      ${svgScatter(st.map(i => ({ x: i.p, y: i.D, c: DCOL[i.domain], act: 'item', v: i.idx, lab: i.status === 'review' || i.D < .15 ? 'Q' + i.q : '', tip: `<b>Q${i.q}</b> · ${attr(DOM[i.domain].short)} — ${attr(SK[i.skill].name)}<br>p ${F(i.p)} · D ${F(i.D)} · r ${F(i.r)}<br>${attr(i.status)}` })), { x0: 0, x1: 1, y0: -.2, y1: .8, xt: [0, .2, .4, .6, .8, 1], yt: [-.2, 0, .2, .4, .6, .8], xf: v => v.toFixed(1), yf: v => v.toFixed(1), hline: .2, xlab: 'difficulty p (proportion correct)', ylab: 'discrimination D', aria: 'Item difficulty vs discrimination' })}
      ${legend(DOMS.map(d => ['c', DCOL[d.id], d.name]))}</div>
    <div class="card"><h2>Item difficulty distribution</h2>${svgHist(pb.map(b => { const c = st.filter(i => i.p >= b && (b >= .9 ? i.p <= 1 : i.p < b + .1)).length; return { label: b.toFixed(1), v: c, tip: `p ${b.toFixed(1)}–${(b + .1).toFixed(1)}: ${c} items` }; }), { xlab: 'item p', h: 180, aria: 'difficulty distribution' })}</div>
    <div class="card"><h2>Discrimination distribution</h2>${svgHist(db.map(b => { const c = st.filter(i => i.D >= b && i.D < b + .1).length; return { label: b.toFixed(1), v: c, c: b < .2 ? 'var(--caution)' : 'var(--brand)', tip: `D ${b.toFixed(1)}–${(b + .1).toFixed(1)}: ${c} items` }; }), { xlab: 'item D (orange = below 0.20)', h: 180, aria: 'discrimination distribution' })}</div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Cognitive profile (Zerone layer) ${TAG.z}</h2><p class="desc">Items per Zerone cognitive category and Growth domain.</p>
      <table class="t"><thead><tr><th class="l">Category</th>${DOMS.map(d => `<th>${esc(d.short)}</th>`).join('')}<th>% correct</th></tr></thead><tbody>${cross.map(r => `<tr><td class="l">${r.c}</td>${r.by.map(v => `<td>${v || ''}</td>`).join('')}<td>${P(mean(st.filter(i => i.cog === r.c).map(i => i.p)), 1)}</td></tr>`).join('')}</tbody></table>
      <div class="note warn"><b>Finding:</b> in this form the Zerone cognitive tags coincide with the Growth structure — all 18 Science items are tagged <i>Knowing</i>, all 18 English items <i>Understanding</i>, and the three Mathematics skills map one-to-one onto <i>Applying</i>, <i>Analyzing</i> and <i>Evaluating</i>. So the Zerone "cognitive" profile is the domain/skill profile under another name, and "Knowing" cannot be read as recall here. Worth raising with Zerone before the tags are used for interpretation.</div></div>
    <div class="card"><h2>Item level profile ${TAG.z}</h2><table class="t"><thead><tr><th class="l">Level</th>${DOMS.map(d => `<th>${esc(d.short)}</th>`).join('')}<th>Mean p</th><th>Mean D</th></tr></thead><tbody>${lvl.map(r => `<tr><td class="l">Level ${r.l}</td>${r.by.map(v => `<td>${v}</td>`).join('')}<td>${F(r.p)}</td><td>${F(r.D)}</td></tr>`).join('')}</tbody></table>
      <p class="note">Mean p falls from Level 1 to Level 3 while discrimination holds, so the levels order difficulty as intended. But the levels are unevenly spread: ${lvl[0].by[2] === 18 ? '<b>all 18 Science items are Level 1</b>, so Science has no Level 2–3 evidence on this form and its higher domain mean partly reflects item demand, not only student strength.' : 'check the spread by domain.'}</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Items worth a look</h2><p class="desc">Flagged by status or by a signal. Click to open.</p>
    <div class="tw" style="--mh:420px"><table class="t"><thead><tr><th class="l">Item</th><th class="l">Skill</th><th>p</th><th>D</th><th>r</th><th class="l">Status</th><th class="l">Signals</th></tr></thead><tbody>
    ${flagged.map(i => `<tr data-act="item" data-v="${i.idx}" style="cursor:pointer"><td class="l"><b>Q${i.q}</b></td><td class="l">${dchip(i.domain)} ${esc(SK[i.skill].name)}</td><td>${F(i.p)}</td><td>${F(i.D)}</td><td>${F(i.r)}</td><td class="l">${statusChip(i.status)}</td><td class="l wrap small">${esc(i.notes.join(' · '))}</td></tr>`).join('')}</tbody></table></div></div>`;
};

VIEWS.engagement = () => {
  const a = adm(), N = net(a), z = a.zerone, zn = z.network;
  const withMin = a.fin.filter(r => isNum(r.minutes));
  const thr = S.rapid;

  const tie = L.filter(o => o.a.mean + o.a.ci95 >= top.a.mean - top.a.ci95);
  const rank = rowChart(L.map(o => ({ lab: sn(o.school), act: 'goSchool', v: o.school, marks: [{ t: 'rng', a: o.a.mean - o.a.ci95, b: o.a.mean + o.a.ci95, c: o.pos === 'above' ? 'var(--er)' : o.pos === 'below' ? 'var(--caution)' : 'var(--muted)' }, { t: 'ref', v: N.mean }, { t: 'dot', v: o.a.mean, c: 'var(--ink)' }], val: P(o.a.mean), sub: `± ${PN(o.a.ci95)}`, tip: `<b>${attr(sn(o.school))}</b><br>Mean ${P(o.a.mean)} · 95% CI ${P(o.a.mean - o.a.ci95)}–${P(o.a.mean + o.a.ci95)}<br>n ${o.a.n}` })), { min: .3, max: .7, lw: 210, vw: 64, ticks: [.3, .4, .5, .6, .7] });
  const fair = rowChart(L.map(o => ({ lab: sn(o.school), act: 'goSchool', v: o.school, marks: [{ t: 'rng', a: o.diff - o.a.ci95, b: o.diff + o.a.ci95, c: 'var(--muted)' }, { t: 'dot', v: o.diff, c: o.pos === 'above' ? 'var(--er)' : o.pos === 'below' ? 'var(--caution)' : 'var(--muted)' }], val: PTS(o.diff) + ' pts', sub: o.pos, tip: `<b>${attr(sn(o.school))}</b><br>Mean ${P(o.a.mean)} vs expected ${P(o.exp)} for its grade mix<br>${PTS(o.diff)} pts · d = ${F(o.d)} · ${o.pos}` })), { min: -.2, max: .2, lw: 190, vw: 72, ticks: [-.2, -.1, 0, .1, .2] });
  const cmp = S.cmp.filter(s => SCHOOLS.includes(s));

  const cmpBlock = cmp.length >= 2 ? (() => {
    const xs = cmp.map(s => ({ s, x: schoolAgg(a, s) }));
    const pairs = []; for (let i = 0; i < xs.length; i++) for (let j = i + 1; j < xs.length; j++) { const p = xs[i], q = xs[j], d = p.x.mean - q.x.mean, se = Math.sqrt(p.x.se ** 2 + q.x.se ** 2); pairs.push(`<li>${esc(sn(p.s))} vs ${esc(sn(q.s))}: ${PTS(d)} pts — ${Math.abs(d) > 1.96 * se ? '<b>statistically clear</b> at 95%' : '<b>not statistically clear</b> (intervals overlap)'}</li>`); }
    return `<div class="grid g2" style="margin-top:12px"><div><h3>Domains</h3>${rowChart(DOMS.flatMap(d => xs.map((o, i) => ({ lab: `${d.short} · ${sn(o.s)}`, marks: [{ t: 'bar', v: o.x.dom[d.id], c: DCOL[d.id] }, { t: 'ref', v: N.dom[d.id] }], val: P(o.x.dom[d.id], 0) }))), { lw: 200, vw: 44, th: 13 })}</div>
      <div><h3>Nine skills (difference from Network Reference)</h3><table class="hm"><thead><tr><th></th>${xs.map(o => `<th>${esc(sn(o.s))}</th>`).join('')}</tr></thead><tbody>${SKILLS.map(k => `<tr><td class="nm" style="min-width:150px;font-size:11.5px">${k.dshort[0]} · ${esc(k.name)}</td>${xs.map(o => `<td style="${cellStyle(divColor(o.x.sk[k.id] - N.sk[k.id]))}" data-tip="${attr(sn(o.s))}: ${P(o.x.sk[k.id])} (network ${P(N.sk[k.id])})">${PTS(o.x.sk[k.id] - N.sk[k.id], 0)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div><h3>Distributions</h3>${rowChart(xs.map(o => ({ lab: sn(o.s), marks: [{ t: 'box', a: o.x.q25, b: o.x.q75, lo: o.x.q10, hi: o.x.q90, med: o.x.median, c: 'var(--brand)' }], val: P(o.x.median, 0), sub: 'median' })), { lw: 160, vw: 60 })}</div>
      <div><h3>Are the differences clear?</h3><ul class="small" style="padding-left:18px">${pairs.join('')}</ul><p class="small muted">Two-sample comparison of means with a normal approximation. It says nothing about why schools differ.</p></div></div>`;
  })() : '<p class="small muted">Select two to five schools above to compare them side by side.</p>';
  return `<div class="note crit" style="margin:0 0 14px"><b>Internal technical reference.</b> The "above / below expectation" comparison is kept here for the Academic Board, as in Zerone's School Benchmark. Schools are listed by name, never ranked. It is not the EASE Growth school message, must not be published as a league table, and never enter School or Teacher Appraisal (School Baseline Summary Template 26-27; EASE Growth Interpretation Guides §6).</div>
  <div class="grid g-kpi">${kpi('Schools', L.length, '')}${kpi('All-school mean', P(N.mean), `n ${INT(N.n)}`)}${kpi('Between-school share', P(B.etaRaw, 0), `${P(B.etaAdj, 0)} after grade-mix adjustment · Zerone ${a.zerone.network.betweenSchoolVarPct}%`, { g: 'eta' })}${kpi('Clearly above / below', `${L.filter(o => o.pos === 'above').length} / ${L.filter(o => o.pos === 'below').length}`, 'vs grade-mix expectation', { g: 'expected' })}${kpi('Top group', tie.length, 'schools statistically tied with the highest mean', { g: 'ci' })}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Mean with 95% confidence interval ${gi('ci')}</h2><p class="desc">Listed by school name, not by rank. Overlapping intervals cannot be told apart. The dark tick is the all-school mean. ${tie.length > 1 ? `The top ${tie.length} (${tie.map(o => esc(sn(o.school))).join(', ')}) are a statistical tie.` : ''}</p>${rank}
      ${legend([['', 'var(--er)', 'Clearly above expectation'], ['', 'var(--muted)', 'Within margin'], ['', 'var(--caution)', 'Clearly below expectation']])}</div>
    <div class="card"><h2>Fair comparison: adjusted for Grade 7 / 8 mix ${gi('expected')}</h2><p class="desc">Difference from the score expected for each school's own grade mix, with its 95% interval. Corrects grade mix only — not prior attainment, context, device or supervision.</p>${fair}</div>
  </div>
  <div class="card" style="margin-top:14px"><div class="row"><h2 style="margin:0">Scorecard — dashboard vs Zerone</h2><span class="spacer"></span><button class="btn sm" data-act="csv" data-v="benchmark">Export CSV</button></div>
    <div class="tw" style="margin-top:8px"><table class="t"><thead><tr><th class="l">School</th><th>n</th><th>Mean</th><th>Zerone</th><th>95% CI ±</th><th>Median</th><th>Grade 7</th><th>Grade 8</th><th>Expected</th><th>vs expected</th><th>Zerone</th><th>d</th><th class="l">Position</th><th>Avg min ${TAG.z}</th><th>&lt;25 min ${TAG.z}</th><th>Blank %</th></tr></thead><tbody>
    ${L.map(o => { const zs = z[o.school] || {}; const ok = Math.round(o.a.mean * 1000) / 10 === zs.meanPct; return `<tr><td class="l"><button class="link" data-act="goSchool" data-v="${attr(o.school)}">${esc(sn(o.school))}</button></td><td>${o.a.n}</td><td>${P(o.a.mean)}</td><td style="color:${ok ? 'var(--good)' : 'var(--critical)'}" data-tip="${ok ? 'Matches Zerone' : 'Differs from Zerone'}">${zs.meanPct}% ${ok ? '✓' : '✗'}</td><td>${PN(o.a.ci95)}</td><td>${P(o.a.median)}</td><td>${o.a.g7n ? P(o.a.g7) + ` <span class="muted">(${o.a.g7n})</span>` : '–'}</td><td>${o.a.g8n ? P(o.a.g8) + ` <span class="muted">(${o.a.g8n})</span>` : '–'}</td><td>${P(o.exp)}</td><td>${PTS(o.diff)}</td><td class="muted">${zs.vsExpected > 0 ? '+' : ''}${zs.vsExpected}</td><td>${F(o.d)}</td><td class="l"><span class="fl ${o.pos === 'above' ? 'easy' : o.pos === 'below' ? 'watch' : 'info'}">${o.pos}</span></td><td>${zs.avgMinutes}</td><td>${zs.rapid25} (${zs.rapid25Pct}%)</td><td>${P(o.a.blank, 1)}</td></tr>`; }).join('')}</tbody></table></div>
    <p class="note">Mean, CI, median, grade means, expectation, difference and d are recomputed by the dashboard from the responses; "Zerone" columns show the published values for comparison. Minutes and rapid-finisher counts are Zerone's own.</p></div>
  <div class="card" style="margin-top:14px"><h2>Zerone cognitive and level profile by school ${TAG.z}</h2><p class="desc">% correct, coloured by difference from the all-school value for the column. See Assessment quality for why the cognitive tags duplicate the domain structure on this form.</p>
    <div class="tw"><table class="hm"><thead><tr><th></th>${COGS.map(c => `<th>${c}</th>`).join('')}${[1, 2, 3].map(l => `<th>Level ${l}</th>`).join('')}</tr></thead><tbody>
    ${[...SCHOOLS].sort((x, y) => sn(x).localeCompare(sn(y))).map(s => { const x = schoolAgg(a, s); const v = qs => mean(qs.map(q => x.p[q])), r = qs => mean(qs.map(q => N.p[q])); const groups = [...COGS.map(c => ITEMS.filter(i => i.cog === c).map(i => i.q - 1)), ...[1, 2, 3].map(l => ITEMS.filter(i => i.level === l).map(i => i.q - 1))]; return `<tr><td class="nm">${esc(sn(s))}</td>${groups.map(g => `<td style="${cellStyle(divColor(v(g) - r(g)))}" data-tip="${attr(sn(s))}: ${P(v(g))} · all ${P(r(g))}">${PN(v(g), 0)}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div></div>

VIEWS.growth = () => {
  if (ADMINS.length < 2) {
    const a = adm();
    return `${secH('Growth over time', 'Growth I is the baseline. No growth values exist yet, and none are estimated.')}
    <div class="card empty" style="text-align:left;max-width:900px;margin:0 auto">
      <h3>Growth I baseline · ${esc(a.date)}</h3>
      <p>This section switches on automatically once a second comparable administration is loaded (Growth II, about April 2027). It will then show, for the network, each school, each domain and skill and — where the same Student ID appears in both files — each student:</p>
      <ul><li>Growth I and Growth II results side by side, and the change in percentage points;</li><li>slope charts of school change, a domain × skill change heatmap, and the distribution of student change for matched students;</li><li>the number of students matched, and those who sat only one administration.</li></ul>
      <div class="note warn"><b>Version 1 rule.</b> EASE Growth 2026-27 runs one fixed-form package per band and reports every result as a baseline; formal semester-to-semester growth comparison is Phase 2 (EASE Growth Overview 26-27). Change figures will be labelled as descriptive raw-% change, valid only when both administrations use the same or linked forms — the dashboard checks the item IDs and warns when they differ.</div>
      <div class="note"><b>Student matching.</b> This file carries provisional IDs (a hash of school, name and grade) because the Zerone export has no stable student ID. Ask Zerone to include the student account ID in the Growth II export; matching on names alone is fragile.</div>
      <div class="row" style="margin-top:14px"><label class="btn pri" style="cursor:pointer">Load an administration file…<input type="file" accept=".json,application/json" data-f="importAdmin" hidden></label><span class="small muted">Produced by <code>pipeline/build_data.py</code> in the same format as <code>data/growth_I_band2.json</code>.</span></div>
    </div>`;
  }
  const from = ADMINS.find(x => x.id === S.gFrom) || ADMINS[0], to = ADMINS.find(x => x.id === S.gTo) || ADMINS[ADMINS.length - 1];
  const A0 = net(from), A1 = net(to);
  const sameForm = from === to ? true : (from.itemIds || ITEMS.map(i => i.qid)).join() === (to.itemIds || ITEMS.map(i => i.qid)).join();
  const matched = from.fin.map(r => ({ r0: r, r1: to.bySid.get(r.sid) })).filter(o => o.r1 && o.r1.status === 'Finished');
  const ch = matched.map(o => o.r1.pct - o.r0.pct);
  const cb = Array.from({ length: 12 }, (_, i) => -.3 + i * .05);
  const sel2 = (k, v) => `<select data-f="${k}">${ADMINS.map(x => `<option value="${attr(x.id)}" ${x.id === v.id ? 'selected' : ''}>${esc(x.label)} · ${esc(x.date)}</option>`).join('')}</select>`;
  const list = (isBoard() ? SCHOOLS : [S.focus]).filter(s => schoolAgg(from, s).n && schoolAgg(to, s).n);
  const W = 520, H = 40 + list.length * 22, y = v => 20 + (H - 40) * (1 - (v - .3) / .4);
  // label de-overlap: keep at least 12 px between right-hand labels
  const ly = {}; { let last = -1e9; list.map(s => ({ s, y: y(schoolAgg(to, s).mean) })).sort((p, q) => p.y - q.y).forEach(o => { const v = Math.max(o.y, last + 12); ly[o.s] = v; last = v; }); }
  const slope = `<svg viewBox="0 0 ${W} ${Math.max(H, 40 + list.length * 13 + 20)}" style="width:100%;height:auto"><text x="120" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">${esc(from.label)}</text><text x="400" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">${esc(to.label)}</text>
    ${list.map(s => { const p = schoolAgg(from, s).mean, q = schoolAgg(to, s).mean; return `<g data-tip="<b>${attr(sn(s))}</b><br>${P(p)} → ${P(q)} (${PTS(q - p)} pts)" data-act="goSchool" data-v="${attr(s)}" style="cursor:pointer"><line x1="120" x2="400" y1="${y(p)}" y2="${y(q)}" stroke="${q >= p ? 'var(--er)' : 'var(--caution)'}" stroke-width="2"/><circle cx="120" cy="${y(p)}" r="4" fill="var(--ink-2)"/><circle cx="400" cy="${y(q)}" r="4" fill="var(--ink)"/><text x="408" y="${ly[s] + 3.5}" font-size="10" fill="var(--ink-2)">${esc(sn(s))} ${PTS(q - p, 0)}</text></g>`; }).join('')}</svg>`;
  return `${secH('Growth over time', `${esc(from.label)} → ${esc(to.label)}`, TAG.d)}
  <div class="card"><div class="filters" style="padding:0;border:0"><label>From${sel2('gFrom', from)}</label><label>To${sel2('gTo', to)}</label></div>
    ${!sameForm ? '<div class="note crit"><b>Different forms.</b> The item IDs differ between these administrations. Raw % change is not comparable until the forms are linked or equated.</div>' : ''}</div>
  <div class="grid g-kpi" style="margin-top:14px">${kpi(from.label, P(A0.mean), `n ${A0.n}`)}${kpi(to.label, P(A1.mean), `n ${A1.n}`)}${kpi('Change (network)', PTS(A1.mean - A0.mean) + ' pts', 'different populations may be included')}${kpi('Matched students', INT(matched.length), `mean change ${matched.length ? PTS(mean(ch)) + ' pts' : '–'}`)}${DOMS.map(d => kpi(d.short + ' change', PTS(A1.dom[d.id] - A0.dom[d.id]) + ' pts', `${P(A0.dom[d.id], 0)} → ${P(A1.dom[d.id], 0)}`, { c: DCOL[d.id] })).join('')}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>School change</h2>${slope}</div>

  add('Started', started, 962, started === 962);
  add('Finished sessions', N.n, 960, N.n === 960);
  add('Unfinished', st.Unfinished || 0, 2, (st.Unfinished || 0) === 2);
  add('No-response records', st['Not Assessed'] || 0, 68, (st['Not Assessed'] || 0) === 68);
  add('Schools', SCHOOLS.length, 15, SCHOOLS.length === 15);
  add('All-school mean', P(N.mean, 2), '52.3%', Math.round(N.mean * 1000) === 523);
  add('Grade 7 mean', P(N.g7, 2), '50.3%', Math.round(N.g7 * 1000) === 503);

  add('Student SD', PN(N.sd, 2) + ' pts', '17.4', Math.abs(N.sd * 100 - 17.4) < .1);
  const dt = { ER: 552, MR: 440, SL: 576 };
  for (const d of DOMS) add(d.name, P(N.dom[d.id], 2), (dt[d.id] / 10) + '%', Math.round(N.dom[d.id] * 1000) === dt[d.id]);
  const low = [...SKILLS].sort((x, y) => N.sk[x.id] - N.sk[y.id])[0];
  add('Lowest skill', `${low.dshort} — ${low.name} ${P(N.sk[low.id], 1)}`, 'Mathematics — Reason / Evaluate ≈ 28.2%', low.id === 'MR3' && Math.round(N.sk.MR3 * 1000) === 282);
  add('Overall = mean of 3 domains', F(N.mean - mean(DOMS.map(d => N.dom[d.id])), 12), '0', Math.abs(N.mean - mean(DOMS.map(d => N.dom[d.id]))) < 1e-9);
  let comps = 0, mism = 0;
  if (!Object.keys(z.itemProfile || {}).length) { add('School × item comparison with Zerone', 'Academic Board view only', '810 / 0', true); return c; }
  if (!LOCK) for (const [s, qv] of Object.entries(z.itemProfile)) { const x = schoolAgg(a, s); for (const [q, v] of Object.entries(qv)) { comps++; const ours = x.p[+q - 1] * 100; if (!(Math.floor(ours + .5) === v || Math.abs(ours - v) <= .5 + 1e-9)) mism++; } }
  else for (const [s, qv] of Object.entries(z.itemProfile)) { const x = schoolAgg(a, s); if (!x.n) continue; for (const [q, v] of Object.entries(qv)) { comps++; const ours = x.p[+q - 1] * 100; if (!(Math.floor(ours + .5) === v || Math.abs(ours - v) <= .5 + 1e-9)) mism++; } }
  add('School × item comparisons with Zerone', comps, 810, comps === 810);
  add('Mismatches with Zerone', mism, 0, mism === 0);
  return c;
}

const TIP = $('#tip');
function showTip(el, x, y) {
  const t = el.getAttribute('data-tip'); if (!t) return hideTip();

  TIP.style.left = Math.max(8, l) + 'px'; TIP.style.top = Math.max(8, tp) + 'px';
}
function hideTip() { TIP.classList.remove('on'); }
