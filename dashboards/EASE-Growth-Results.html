      [['Network Reference', N], ...list.map(s => [sn(s), schoolAgg(a, s)])].map(([s, x]) => [s, x.n, r1(x.mean), r1(x.median), r1(x.sd), r1(x.q10), r1(x.q25), r1(x.q75), r1(x.q90), ...x.bands10]));
  } else if (kind === 'items') {
    const f = effF(), st = itemsFor(a, f).filter(itemFilterPass);
    const G7 = agg(subsetRows(a, { ...f, grade: '7' })), G8 = agg(subsetRows(a, { ...f, grade: '8' }));
    csvDownload(`${tag}_items.csv`, ['Q', 'Question ID', 'Key', 'Domain', 'Skill', 'Cognitive (Zerone)', 'Level', 'p', 'p answered only', 'D', 'r item-rest', 'A %', 'B %', 'C %', 'D %', 'Blank %', 'Upper-27 correct', 'Lower-27 correct', 'G7 p', 'G8 p', 'Status', 'Signals'],
      st.map(i => [i.q, i.qid, i.key, DOM[i.domain].name, SK[i.skill].name, i.cog, i.level, F(i.p, 3), F(i.pAns, 3), F(i.D, 3), F(i.r, 3), r1(i.dist.A), r1(i.dist.B), r1(i.dist.C), r1(i.dist.D), r1(i.blank), r1(i.dU[i.key]), r1(i.dL[i.key]), F(G7.p?.[i.idx], 3), F(G8.p?.[i.idx], 3), i.status, i.notes.join('; ')]));
  } else if (kind === 'actions') {
    const s = curSchool();
    csvDownload(`${tag}_actions_${sn(s).replace(/\W+/g, '-')}.csv`, ['School', 'Priority', 'Evidence', 'Recommended response', 'Suggested owner', 'Review by', 'Decision / notes'], schoolActions(s).map(r => [sn(s), r.priority, r.evidence, r.response, r.owner, r.review, r.decision]));
  } else if (kind === 'engagement') {
    csvDownload(`${tag}_engagement.csv`, ['School', 'n', 'Avg minutes (Zerone)', 'Under 25 min (Zerone)', 'Under 25 min % (Zerone)', 'Blank %', 'Students 5+ blank', 'Mean %'],
      SCHOOLS.map(s => { const x = schoolAgg(a, s), z = a.zerone.schools[s] || {}; return [sn(s), x.n, z.avgMinutes, z.rapid25, z.rapid25Pct, r1(x.blank), x.blank5, r1(x.mean)]; }));
  } else if (kind === 'benchmark') {
    csvDownload(`${tag}_internal-benchmark.csv`, ['School', 'n', 'Mean %', 'Zerone mean %', '95% CI ±', 'Median %', 'Grade 7 %', 'Grade 8 %', 'Expected %', 'vs expected pts', 'Effect size d', 'Position'],
      [...benchmark(a).list].sort((p, q) => sn(p.school).localeCompare(sn(q.school))).map(o => [sn(o.school), o.a.n, r1(o.a.mean), a.zerone.schools[o.school]?.meanPct, r1(o.a.ci95), r1(o.a.median), r1(o.a.g7), r1(o.a.g8), r1(o.exp), r1(o.diff), F(o.d), o.pos]));
  }
}

// ---------- print ------------------------------------------------------------
const PH = { ER: '#4a8fe6', MR: '#7d3cb0', SL: '#0f9a6e' };
const pbar = (v, c) => `<div class="pbar"><span style="width:${Math.max(0, Math.min(100, v * 100))}%;background:${c}"></span></div>`;
function prHead(eyebrow, title, sub) { return `<div class="ph"><div class="e">${eyebrow}</div><h1>${title}</h1><div style="color:#555">${sub}</div></div>`; }
function prSnapshot(r) {
  const a = adm();
  const head = prHead(`EASE Growth · Student Baseline Snapshot · ${esc(a.label)}`, esc(r.name), `${esc(sn(r.school))} · Grade ${r.grade} · ${esc(r.cls)} · ${esc(a.bandLabel)} · ${esc(a.date)}`);
  if (r.status !== 'Finished') return `<div class="pg pr">${head}<div class="callout"><b>${r.status === 'Unfinished' ? 'Started but not finished' : 'Absent / not assessed'}.</b> No baseline is reported for this administration.</div></div>`;
  const { hi, lo } = studentStrengthFocus(r);
  return `<div class="pg pr">${head}
    <div class="box3"><div class="bx">Overall baseline<b>${P(r.pct)}</b>${r.score} of 54 correct · ${r.blanks} blank</div>${DOMS.map(d => `<div class="bx" style="border-top:4px solid ${PH[d.id]}">${esc(d.name)}<b>${P(r.dom[d.id] / 18)}</b>${r.dom[d.id]} of 18 correct</div>`).join('')}</div>
    <h2>Skill profile</h2><table><thead><tr><th>Domain</th><th>Skill</th><th class="r">Correct</th><th style="width:35%"></th></tr></thead><tbody>
    ${SKILLS.map(k => `<tr><td>${esc(k.dname)}</td><td>${esc(k.name)}</td><td class="r">${r.sk[k.id]} / 6</td><td>${pbar(r.sk[k.id] / 6, PH[k.domain])}</td></tr>`).join('')}</tbody></table>
    <div class="callout"><b>Relative strength:</b> ${esc(hi.name)} within ${esc(hi.dname)} (${r.sk[hi.id]} / 6).<br><b>Next focus:</b> ${esc(lo.name)} within ${esc(lo.dname)} (${r.sk[lo.id]} / 6).</div>
    <div class="foot">This is a baseline, not a grade or ranking. Blank items count as not correct. Each skill result is based on 6 questions and is an initial diagnostic indication. This snapshot contains no ranking, percentile, proficiency level, growth score, predicted Cambridge grade, university-readiness claim or ability judgement. Growth can only be discussed after a comparable later administration.</div></div>`;
}
function prFamily(r) {
  const a = adm();
  const head = prHead(`EASE Growth · Family Baseline Report · ${esc(a.label)}`, esc(r.name), `${esc(sn(r.school))} · Grade ${r.grade} · ${esc(r.cls)} · ${esc(a.date)}`);
  if (r.status !== 'Finished') return `<div class="pg pr">${head}<div class="callout">${r.status === 'Unfinished' ? 'This session was started but not finished, so no baseline result is reported. The school will let you know about any follow-up.' : 'No result is reported for this administration because the student was not assessed.'}</div></div>`;
  const { hi, lo } = studentStrengthFocus(r);
  return `<div class="pg pr">${head}
    <p>Dear Parent/Guardian, this report shows <b>${esc(r.name)}</b>'s starting point in EASE Growth. It helps identify areas of relative strength and areas to support next.</p>
    <div class="box3"><div class="bx">Overall baseline<b>${P(r.pct)}</b>${r.score} of 54 correct</div>${DOMS.map(d => `<div class="bx" style="border-top:4px solid ${PH[d.id]}">${esc(d.name)}<b>${P(r.dom[d.id] / 18)}</b>${r.dom[d.id]} of 18</div>`).join('')}</div>
    <h2>What stands out</h2><p><b>Relative strength:</b> ${esc(hi.name)} in ${esc(hi.dname)}.<br><b>Development focus:</b> ${esc(lo.name)} in ${esc(lo.dname)}.</p>
    <h2>How you can support at home</h2><p>${esc(lo.home)}</p><p>Short, calm and regular practice helps more than special cramming.</p>
    <div class="callout"><b>How to read this report.</b> This is the first Growth baseline. It does not show improvement yet, and it is not a pass/fail grade or ranking. Each domain uses 18 questions; each skill uses 6.${r.blanks ? ` Blank items (${r.blanks}) count as not correct.` : ''}</div>
    <div class="foot">This is a baseline report. It does not include ranking, percentile, proficiency level, predicted exam grade, growth score, or comparison with classmates or other schools.</div></div>`;
}
function prSchool(s) {
  const a = adm(), N = net(a), x = schoolAgg(a, s), pr = schoolProfile(x, N), acts = schoolActions(s);
  const rows = a.rows.filter(r => r.school === s);
  const classes = classesOf(s).map(c => ({ c, x: agg(a.fin.filter(r => r.school === s && String(r.cls) === String(c))) })).filter(o => o.x.n);
  const hi = S.lens === 'abs' ? pr.highAbs : pr.highRel, lo = S.lens === 'abs' ? pr.lowAbs : pr.lowRel;
  return `<div class="pg pr">${prHead(`EASE Growth · School Baseline Summary · ${esc(a.label)}`, esc(sn(s)), `${esc(a.bandLabel)} · ${esc(a.date)} · 54 questions · Network Reference = ${INT(N.n)} finished sessions in ${SCHOOLS.length} schools`)}
    <h2>1. Who was assessed?</h2><p>${x.n} finished sessions (Grade 7: ${x.g7n}, Grade 8: ${x.g8n}). Raw export: ${rows.length} records, ${rows.filter(r => r.status === 'Unfinished').length} unfinished, ${rows.filter(r => r.status === 'Not Assessed').length} with no response. This is an operational figure, not a participation rate.</p>
    <table><thead><tr><th>Class</th><th class="r">Finished</th><th class="r">Overall</th>${DOMS.map(d => `<th class="r">${esc(d.short)}</th>`).join('')}</tr></thead><tbody>${classes.map(o => `<tr><td>${esc(o.c)}</td><td class="r">${o.x.n}</td><td class="r">${P(o.x.mean)}</td>${DOMS.map(d => `<td class="r">${P(o.x.dom[d.id])}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <h2>2. What is the school's overall baseline?</h2><table><thead><tr><th>Measure</th><th class="r">School</th><th class="r">Network Reference</th><th class="r">Difference</th></tr></thead><tbody>
      ${[['Overall', x.mean, N.mean], ...DOMS.map(d => [d.name, x.dom[d.id], N.dom[d.id]])].map(([k, v, r]) => `<tr><td>${esc(k)}</td><td class="r">${P(v)}</td><td class="r">${P(r)}</td><td class="r">${PTS(v - r)} pts</td></tr>`).join('')}</tbody></table>
    <p>Median ${P(x.median)}; the middle half of students scored ${P(x.q25, 0)}–${P(x.q75, 0)}. Students per 10-point interval: ${x.bands10.map((c, i) => `${i * 10}–${i === 9 ? 100 : i * 10 + 9}%: ${c}`).join(' · ')}.</p>
    <h2>3. Relative strengths</h2><ul>${hi.map(p => `<li>${esc(p.s.dname)} — ${esc(p.s.name)}: ${P(p.v)} (network ${P(N.sk[p.s.id])})</li>`).join('')}</ul>
    <h2>4. Development priorities</h2><ul>${lo.map(p => `<li>${esc(p.s.dname)} — ${esc(p.s.name)}: ${P(p.v)} (network ${P(N.sk[p.s.id])})</li>`).join('')}</ul>
    <h2>5. Before Growth II</h2><table><thead><tr><th>Priority</th><th>Recommended response</th><th>Owner</th><th>Review by</th><th>Decision</th></tr></thead><tbody>${acts.map(r => `<tr><td>${esc(r.priority)}</td><td>${esc(r.response)}</td><td>${esc(r.owner)}</td><td>${esc(r.review)}</td><td>${esc(r.decision)}</td></tr>`).join('')}</tbody></table>
    <h2>Nine-skill profile</h2><table><thead><tr><th>Skill</th><th class="r">School</th><th class="r">Network</th><th style="width:30%"></th></tr></thead><tbody>${SKILLS.map(k => `<tr><td>${esc(k.dshort)} — ${esc(k.name)}</td><td class="r">${P(x.sk[k.id])}</td><td class="r">${P(N.sk[k.id])}</td><td>${pbar(x.sk[k.id], PH[k.domain])}</td></tr>`).join('')}</tbody></table>
    <div class="foot">Growth I is one baseline measurement point, not a verdict on school quality, and it is not a growth score. Skill results use 6 questions each. Do not publish a league table or rank schools, classes, teachers or students; do not use these results as a School Appraisal rating, a Teacher Appraisal score, or for placement or streaming. Use findings together with classwork, Common Assessment evidence and the next comparable Growth administration.</div></div>`;
}
function prNetwork() {
  const a = adm(), N = net(a), st = itemsFor(a, { school: '', grade: '', cls: '' }), B = benchmark(a);
  const s = a.rows.reduce((m, r) => (m[r.status] = (m[r.status] || 0) + 1, m), {});
  return `<div class="pg pr">${prHead(`EASE Growth · Network Technical Summary · ${esc(a.label)}`, `${esc(a.bandLabel)}`, `${esc(a.date)} · Zerone exam ${a.zeroneExamId} · internal — Academic Board`)}
    <div class="box3"><div class="bx">Finished sessions<b>${N.n}</b>${SCHOOLS.length} schools</div><div class="bx">All-school mean<b>${P(N.mean)}</b>SD ${PN(N.sd)} pts</div><div class="bx">Grade 7 / Grade 8<b>${P(N.g7, 1)} / ${P(N.g8, 1)}</b>n ${N.g7n} / ${N.g8n}</div><div class="bx">KR-20<b>${F(N.kr20, 3)}</b>SEM ${F(N.sem, 2)} items</div></div>
    <h2>Data flow</h2><p>${a.rows.length} exported → ${a.rows.filter(r => r.answered > 0).length} started → ${N.n} finished; ${s.Unfinished || 0} unfinished; ${s['Not Assessed'] || 0} with no response. Blank responses among finished sessions: ${P(N.blank, 2)}. Not a participation rate.</p>
    <h2>Domains and skills</h2><table><thead><tr><th>Domain</th><th>Skill</th><th class="r">Network</th><th class="r">Grade 7</th><th class="r">Grade 8</th></tr></thead><tbody>
    ${(() => { const G7 = agg(a.fin.filter(r => r.grade === 7)), G8 = agg(a.fin.filter(r => r.grade === 8)); return DOMS.map(d => `<tr style="font-weight:700"><td>${esc(d.name)}</td><td></td><td class="r">${P(N.dom[d.id])}</td><td class="r">${P(G7.dom[d.id])}</td><td class="r">${P(G8.dom[d.id])}</td></tr>` + d.skills.map(k => `<tr><td></td><td>${esc(k.name)}</td><td class="r">${P(N.sk[k.id])}</td><td class="r">${P(G7.sk[k.id])}</td><td class="r">${P(G8.sk[k.id])}</td></tr>`).join('')).join(''); })()}</tbody></table>
    <h2>Measurement</h2><p>Between-school share of variance ${P(B.etaRaw, 0)} (${P(B.etaAdj, 0)} after grade mix). Items: ${['good', 'watch', 'review', 'too easy', 'very hard'].map(k => `${k} ${st.filter(i => i.status === k).length}`).join(' · ')}. Zerone's cognitive tags coincide with the domain/skill structure on this form.</p>
    <h2>Reconciliation</h2><table><tbody>${liveQA().map(c => `<tr><td>${esc(c.k)}</td><td class="r">${esc(c.ours)}</td><td class="r">${esc(c.tgt)}</td><td>${c.ok ? '✓' : '✗'}</td></tr>`).join('')}</tbody></table>
    <div class="foot">Internal technical reference. Growth I is a baseline; no growth, proficiency levels or rankings are published from it.</div></div>`;
}
function prItems() {
  const a = adm(), f = effF(), st = itemsFor(a, f).filter(itemFilterPass);
  return `<div class="pr">${prHead('EASE Growth · Item Analysis · internal', `${esc(a.bandLabel)} · ${esc(a.label)}`, `${esc(f.school ? sn(f.school) : 'Network')} · n ${subsetRows(a, f).length} · ${st.length} items`)}
    <table style="font-size:10.5px"><thead><tr><th>Q</th><th>ID</th><th>Key</th><th>Domain · skill</th><th>Cog.</th><th>Lvl</th><th class="r">p</th><th class="r">D</th><th class="r">r</th><th class="r">A</th><th class="r">B</th><th class="r">C</th><th class="r">D</th><th class="r">Blank</th><th>Status</th></tr></thead><tbody>
    ${st.map(i => `<tr><td>${i.q}</td><td>${esc(i.qid)}</td><td><b>${i.key}</b></td><td>${esc(DOM[i.domain].short)} · ${esc(SK[i.skill].name)}</td><td>${esc(i.cog)}</td><td>${i.level}</td><td class="r">${F(i.p)}</td><td class="r">${F(i.D)}</td><td class="r">${F(i.r)}</td>${['A', 'B', 'C', 'D'].map(o => `<td class="r" style="${o === i.key ? 'font-weight:700' : ''}">${PN(i.dist[o], 0)}</td>`).join('')}<td class="r">${PN(i.blank, 1)}</td><td>${esc(i.status)}</td></tr>`).join('')}</tbody></table>
    <div class="foot">Status rules follow Zerone's item-analysis report. p uses the fixed denominator (blank = not correct).</div></div>`;
}
function printHTML(html) {
  $('#print-root').innerHTML = html;
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); $('#print-root').innerHTML = ''; removeEventListener('afterprint', done); };
  addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}
function doPrint(kind) {
  const a = adm();
  if (kind === 'snapshot' || kind === 'family') { const r = a.bySid.get(S.sid); if (r) printHTML(kind === 'family' ? prFamily(r) : prSnapshot(r)); }
  else if (kind === 'classSnap' || kind === 'classFamily') {
    const { rows } = stuRowsInScope();
    const list = [...rows].sort((p, q) => p.name.localeCompare(q.name));
    printHTML(list.map(kind === 'classFamily' ? prFamily : prSnapshot).join(''));
  }
  else if (kind === 'school') printHTML(prSchool(curSchool()));
  else if (kind === 'network') printHTML(prNetwork());
  else if (kind === 'items') printHTML(prItems());
}

// ---------- Growth II import -------------------------------------------------
function importAdmin(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      const admins = j.administrations || (j.administration ? [j.administration] : []);
      if (!admins.length) throw new Error('No administration found in the file.');
      if (j.blueprint && j.blueprint.nItems !== NQ) throw new Error('Blueprint has a different number of items.');
      registerStudents(j.students || []);
      let added = 0;
      for (const ad of admins) {
        if (ADMINS.find(x => x.id === ad.id)) continue;
        if (!Array.isArray(ad.results) || ad.results.some(r => typeof r.resp !== 'string' || r.resp.length !== NQ)) throw new Error(`Administration ${ad.id}: every result needs a ${NQ}-character resp string.`);
        if (j.items) ad.itemIds = j.items.map(i => i.qid);
        ADMINS.push(prepAdmin(ad)); added++;
      }
      ADMINS.sort((x, y) => String(x.date).localeCompare(String(y.date)));
      S.gFrom = ADMINS[0].id; S.gTo = ADMINS[ADMINS.length - 1].id;
      alert(`${added} administration(s) loaded for this session. To make it permanent, add it to data/ with pipeline/build_data.py and rebuild.`);
      renderShell();
    } catch (err) { alert('Could not load the file: ' + err.message); }
  };
  rd.readAsText(file);
}

// ---------- init -------------------------------------------------------------
(function init() {
  const t = store.get('theme', null); if (t) document.documentElement.dataset.theme = t;
  const h = (location.hash || '').slice(1); if (TABS.find(x => x.id === h)) S.tab = h;
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!document.documentElement.dataset.theme) renderShell(); });
  renderShell();
})();

</script>

<script type="module">
  import { doc, getDoc, collection, getDocs, query, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const ADMINISTRATION_ID = 'G1-2026-27';
  const STATUS = { F: 'Finished', U: 'Unfinished', N: 'Not Assessed' };
  const app = document.getElementById('app');
  const say = (title, msg) => { app.innerHTML = `<div class="ah-load"><h2>${title}</h2><p>${msg}</p></div>`; };
  say('Loading EASE Growth results…', 'Checking your access.');

  // network = anonymous rows; schoolDocs = rosters the user may read; internal = admin-only map + Zerone benchmark
  function assemble(network, schoolDocs, internal, lockSchoolId) {
    const byKey = new Map(), codeName = {};
    for (const s of schoolDocs) {
      codeName[s.code] = s.school;
      for (const st of s.students) byKey.set(st.k, { ...st, school: s.school });
    }
    if (internal) for (const [c, v] of Object.entries(internal.codes)) codeName[c] = v.school;
    const students = [], results = [];
    for (const line of network.rows) {
      const [k, code, grade, st, resp] = line.split('|');
      const known = byKey.get(k);
      const school = codeName[code] || ('School ' + code);
      const sid = known ? known.sid : 'anon-' + k;
      students.push({ sid, name: known ? known.name : '(other school)', school, grade: +grade, class: known ? String(known.class) : '—' });
      results.push({ sid, status: STATUS[st], resp, minutes: known ? known.minutes ?? null : null });
    }
    const ex = internal ? internal.excerpts : {};
    const lockSchool = lockSchoolId ? schoolDocs.find(s => s.schoolId === lockSchoolId) : null;
    return {
      schema: 'ease-growth-dashboard/1', generated: network.generated, blueprint: network.blueprint,
      items: network.items.map(it => ({ ...it, excerpt: ex[String(it.q)] || '' })),
      students,
      administrations: [{
        ...network.meta, results,
        zerone: {
          schools: internal ? internal.zeroneSchools : {}, network: network.zeroneNetwork,
          itemProfile: internal ? internal.itemProfile : {}, pAll: internal ? internal.pAll : {},
          minutesNote: internal ? internal.minutesNote : 'Per-student minutes appear only for your own school where Zerone supplied them.',
        },
        reconciledUnfinished: internal ? internal.reconciledUnfinished : [],
      }],
      sources: internal ? internal.sources : [{ file: 'Firestore · ease_growth_reports/' + ADMINISTRATION_ID, role: 'Anonymous network responses + your school roster (Academic Services, reconciled to Zerone).' }],
      ...(lockSchool ? { lock: { mode: 'school', school: lockSchool.school } } : {}),
    };
  }

  function start(DATA) {
    window.DATA = DATA;
    const s = document.createElement('script');
    s.textContent = document.getElementById('ease-app-src').textContent;
    document.body.appendChild(s);
  }

  document.addEventListener('authReady', async ({ detail: { user, profile } } = { detail: window.__authReadyDetail || {} }) => {
    if (window.__loadAcademicNavbar) window.__loadAcademicNavbar('ease-growth-results', { user, profile });
    if (!profile) return;
    const isAdmin = profile.role_academichub === 'academic_admin' || profile.role_centralhub === 'central_admin';
    if (!isAdmin && !profile.schoolId) { say('Your school is not set', 'Set your school in your profile to see your school\'s EASE Growth results.'); return; }
    try {
      const base = ['ease_growth_reports', ADMINISTRATION_ID];
      const netSnap = await getDoc(doc(window.db, ...base));
      if (!netSnap.exists()) { say('No results yet', 'The EASE Growth results for this administration have not been published.'); return; }
      let schoolDocs = [], internal = null;
      if (isAdmin) {
        const [ss, is] = await Promise.all([
          getDocs(query(collection(window.db, ...base, 'schools'), limit(50))),
          getDoc(doc(window.db, ...base, 'internal', 'benchmark')),
        ]);
        schoolDocs = ss.docs.map(d => d.data());
        internal = is.exists() ? is.data() : null;
      } else {
        const own = await getDoc(doc(window.db, ...base, 'schools', profile.schoolId));
        if (!own.exists()) { say('No Band 2 results for your school', 'Your school has no Grade 7–8 EASE Growth results in this administration.'); return; }
        schoolDocs = [own.data()];
      }
      start(assemble(netSnap.data(), schoolDocs, internal, isAdmin ? null : profile.schoolId));
    } catch (err) {
      console.error('[ease-growth-results]', err);
      say('Results could not be loaded', err.code === 'permission-denied' ? 'Your account does not have access to these results yet. Ask your Academic Hub admin.' : 'Please reload the page. If it keeps failing, contact Academic Services.');
    }
  });
</script>
