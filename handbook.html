<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handbooks moved to Google Drive — Academic Hub</title>
  <meta name="robots" content="noindex">
  <!--
    2026-09-30: Academic Hub no longer hosts handbooks. The Google Drive
    documents in Academic Services 26-27 (and Academic Standards 26-27) are the
    single source of truth. This page only redirects:
      /handbook?id=<handbookId>  → that handbook's live Google Doc
      /handbook                  → Academic Services: Start Here
    The map is resources/handbook-redirects.json, generated by
    scripts/handbooks/move-handbooks-to-drive-2026-09-30.js from the pointer
    JSONs. The former reader page is archive/handbook-v1.html (not built).
  -->
  <style>
    :root { --ink: #16152b; --ink-2: #4a4a63; --line: #e6e5ef; --accent: #0e7490; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6fa;
      font-family: "DM Sans", system-ui, sans-serif; color: var(--ink); padding: 16px; box-sizing: border-box; }
    .card { max-width: 520px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px;
      box-shadow: 0 4px 18px rgba(22,21,43,.06); }
    h1 { font-family: "Lora", Georgia, serif; font-weight: 600; font-size: 22px; margin: 0 0 8px; }
    p { color: var(--ink-2); line-height: 1.55; margin: 0 0 16px; font-size: 15px; }
    a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
      padding: 10px 16px; border-radius: 10px; font-size: 14px; }
    .muted { font-size: 13px; margin: 16px 0 0; }
    .muted a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Handbooks now live in Google Drive</h1>
    <p id="msg">Taking you to the live document…</p>
    <a class="btn" id="go" href="https://docs.google.com/document/d/1wLRINpRQUpHtnDqxxw3635tpmHtjypENM7r-rxozsMU/edit">Open Academic Services: Start Here ↗</a>
    <p class="muted"><a href="/">← Back to the Academic Hub home</a></p>
  </div>
  <script>
    (function () {
      var START_HERE = 'https://docs.google.com/document/d/1wLRINpRQUpHtnDqxxw3635tpmHtjypENM7r-rxozsMU/edit';
      var id = new URLSearchParams(location.search).get('id') || '';
      var go = function (url, title) {
        var a = document.getElementById('go');
        a.href = url;
        if (title) a.textContent = 'Open ' + title + ' ↗';
        location.replace(url);
      };
      fetch('/resources/handbook-redirects.json', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (map) {
          var hit = id && map.handbooks && map.handbooks[id];
          if (hit) go(hit.url, hit.title);
          else go((map.default && map.default.url) || START_HERE, (map.default && map.default.title) || 'Academic Services: Start Here');
        })
        .catch(function () {
          document.getElementById('msg').textContent = 'The Academic Services documents in Google Drive are the reference.';
        });
    })();
  </script>
</body>
</html>
